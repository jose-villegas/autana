version: "1.0.0"
dependencies:
  idf: ">=5.5"
  waveshare/esp32_c6_touch_amoled_1_8:
    version: "^1.0.0"
    rules:
      - if: "target == esp32c6"
  waveshare/esp32_s3_touch_amoled_1_8:
    version: "^2.0.3"
    rules:
      - if: "target == esp32s3"
  # The S3's V2 (CO5300 panel) revision - see main/gfx/gfx.c. A private
  # dependency of the S3 BSP above, so it needs its own declaration here
  # too for main to see its headers directly.
  espressif/esp_lcd_co5300:
    version: "^2.1.0"
    rules:
      - if: "target == esp32s3"
  # Comes only as a PRIVATE dependency of the C6 BSP above (not re-exported
  # to main), so main declares it directly. No target rule: the component
  # itself carries no target restriction, and the SH8601 panel path in
  # gfx.c also serves the S3's original (pre-V2) board revision.
  waveshare/esp_lcd_sh8601:
    version: "^2.0.0"
  # input/touch.c calls esp_lcd_touch_*() directly. Public on the C6 BSP
  # above but only a private dependency of the S3 BSP's own touch drivers,
  # so main declares it directly for both.
  espressif/esp_lcd_touch:
    version: "^1.2.0"
