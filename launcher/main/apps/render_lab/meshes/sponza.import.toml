[source]
url = "https://casual-effects.com/g3d/data10/common/model/crytek_sponza/sponza.zip"
sha256 = "da005cbee0be2df2abc8513f3ceb61bcb6f69aac112babcd9c00169a27c2770c"
path = "sponza.obj"
cache = "crytek_sponza"
credit = "Crytek Sponza (Frank Meinl, Crytek; CC BY 3.0), from the OBJ in McGuire's Computer Graphics Archive, casual-effects.com/data."

[output]
directory = ".."
position_scale = 8

[materials]
double_sided = ["fabric_a", "fabric_c", "fabric_d", "fabric_e", "fabric_f", "fabric_g", "leaf", "chain", "Material__57"]

[process]
seed = 1

[geometry]
alpha_mask = { keep_alpha = 0.5 }
thin = { material = "leaf", keep = 0.35 }
simplify = { dense_edge = 45.0, props = ["vase", "vase_round", "vase_hanging", "flagpole", "chain", "leaf", "Material__57", "Material__298", "Material__25", "Material__47"], props_share = 0.3, seal_seams = true }

[visibility]
source = "camera_region"
rounds = 160

[lighting]
light = { ray_offset = 0.5, colour_merge_step = 6, flat_sky_rays = 128 }

[[variants]]
name = "sponza"
triangles = 17381

[[variants]]
name = "sponza_flat"
triangles = 17381
shading = { flat = { auto = { min = 1, max = 16, area = "median" } } }

[[variants]]
name = "sponza_lite"
triangles = 8672

# Fitted offline on a GPU by tools/r3d/fitted_variant.py: the import bakes the
# start at `triangles`, culled to what the camera's path draws, and the fit
# prunes it to `budget` and matches the reference renders of the flythrough.
# The two hashes pin the recipe and the mesh it made.
[[variants]]
name = "sponza_fitted"
triangles = 9973
visibility = { source = "camera_path", every_ms = 100, size = [184, 224], samples = 3, margin = 8 }
fit = { budget = 8672, train_every_ms = 1000, held_out_every_ms = 5000, coverage_every_ms = 100, steps = 2000, batch = 8, laplacian = 10.0, normal_weight = 1.0, sha256 = "44dabf0a7e258912556be8b24593d843629f456cabcba9d64b36336812338afb", recipe_sha256 = "fbde8773baa81a4b87eb8f9e80942ab21af9764b499291a61aeebc61d54ce8c4" }

# The same recipe at the full mesh's budget.
[[variants]]
name = "sponza_fitted_full"
triangles = 19988
visibility = { source = "camera_path", every_ms = 100, size = [184, 224], samples = 3, margin = 8 }
fit = { budget = 17381, train_every_ms = 1000, held_out_every_ms = 5000, coverage_every_ms = 100, steps = 2000, batch = 8, laplacian = 10.0, normal_weight = 1.0, sha256 = "8578cfe1a678859310603ad53a77b11eda4b03cc75fe760377fa10fb92c460d5", recipe_sha256 = "637a09db4ee8b19d65e3a3255bf5c43729d0e83b6f5e7b54b469976d1a14e35f" }
