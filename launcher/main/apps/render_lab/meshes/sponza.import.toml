[source]
url = "https://casual-effects.com/g3d/data10/common/model/crytek_sponza/sponza.zip"
sha256 = "da005cbee0be2df2abc8513f3ceb61bcb6f69aac112babcd9c00169a27c2770c"
path = "sponza.obj"
cache = "crytek_sponza"
credit = "Crytek Sponza (Frank Meinl, Crytek; CC BY 3.0), from the OBJ in McGuire's Computer Graphics Archive, casual-effects.com/data."

[output]
directory = ".."
position_scale = 8

[materials]
double_sided = ["fabric_a", "fabric_c", "fabric_d", "fabric_e", "fabric_f", "fabric_g", "leaf", "chain", "Material__57"]

# Each table below turns one processing step on; they run in this order.
[process]
seed = 1

[process.alpha_mask]
keep_alpha = 0.5

[process.visibility]
rounds = 160

[process.thin]
material = "leaf"
keep = 0.35

[process.light]
ray_offset = 0.5
colour_merge_step = 6
flat_sky_rays = 128
indirect = { bounces = 2, rays = 64, cache_samples = 1 }

[process.simplify]
dense_edge = 45.0
props = ["vase", "vase_round", "vase_hanging", "flagpole", "chain", "leaf", "Material__57", "Material__298", "Material__25", "Material__47"]
props_share = 0.3
seal_seams = true

[[variants]]
name = "sponza"
triangles = 17381

[[variants]]
name = "sponza_flat"
triangles = 17381
face_samples = { auto = { min = 1, max = 16, area = "median" } }

[[variants]]
name = "sponza_lite"
triangles = 8672

# Fitted offline on a GPU by tools/r3d/fitted_variant.py: the import bakes the
# start at `triangles`, culled to what the camera's path draws, and the fit
# prunes it to `budget` and matches the reference renders of the flythrough.
# The two hashes pin the recipe and the mesh it made.
[[variants]]
name = "sponza_fitted"
triangles = 9973
visibility = { source = "camera_path", every_ms = 100, size = [184, 224], samples = 3, margin = 8 }
fit = { budget = 8672, train_every_ms = 1000, held_out_every_ms = 5000, coverage_every_ms = 100, steps = 2000, batch = 8, laplacian = 10.0, normal_weight = 1.0, sha256 = "e7b2620a9905817c9ad11ee1977a502e0900b41d8ef876df9b4744569deb2511", recipe_sha256 = "af2ea0d50fdc9d046480e75b4d963cd3e4244c0a7e5c957a13a8c6628df1d671" }

# The same recipe at the full mesh's budget.
[[variants]]
name = "sponza_fitted_full"
triangles = 19988
visibility = { source = "camera_path", every_ms = 100, size = [184, 224], samples = 3, margin = 8 }
fit = { budget = 17381, train_every_ms = 1000, held_out_every_ms = 5000, coverage_every_ms = 100, steps = 2000, batch = 8, laplacian = 10.0, normal_weight = 1.0, sha256 = "a8f6268cbb5ae48ef6c68945391dbdd1275dd5e24f84fecaeed991d6c8c69c29", recipe_sha256 = "36d9de5184c72aa108a7aa7bab6ad694bf9d6903e728b961966d3b41db0158ef" }
