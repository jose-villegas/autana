# The engine's render settings: RENDER_SETTINGS_DEFAULT
# (render_settings_default.h) is generated from this file. An app's
# NAME.render.toml lists only the values it changes.
cull = true
depth_fit = true
batched = true
partial_redraw = true

[lod]
tolerance_px = 2.0
hysteresis_px = 0.5
coverage_permille = 250
pick_every = 4
triangle_budget = 0
blend = 0
blend_px = 0.25

[ranges."lod.blend"]
min = 0
max = "RENDER_LOD_BLEND_COUNT"
max_exclusive = true

[ranges."lod.blend_px"]
min = 0.0
min_exclusive = true
max = "RENDER_LOD_BLEND_PX_MAX"
