[source]
path = "source/sponza.obj"
credit = "Crytek Sponza (Frank Meinl, Crytek; CC BY 3.0), from the OBJ in McGuire's Computer Graphics Archive, casual-effects.com/data."

[output]
position_scale = 8

[materials]
double_sided = ["fabric_a", "fabric_c", "fabric_d", "fabric_e", "fabric_f", "fabric_g", "leaf", "chain", "Material__57"]

[process]
seed = 1

[geometry]
alpha_mask = { keep_alpha = 0.5 }
thin = { material = "leaf", keep = 0.35 }
simplify = { dense_edge = 45.0, props = [], props_share = 0.0, seal_seams = true, colour_deviation = 1.0 }
# The fits train on probes over the whole atrium (the scene camera has no path).
probes = {}

# The free-standing props: one mesh per repeated shape, each copy drawing
# `triangles` times the variant's objects_scale. No rule names the flagpoles: one that passes
# through the wall stays in the rest, since a carved pole too thin to fill
# its socket shows sky around it, and one that touches nothing is carved as
# a free repeat (20 of the 46). Seams are free: a locked contact keeps every
# copy's border vertices, which a prop of a few dozen triangles cannot afford.
[[objects.meshes]]
match = { material = "vase" }
triangles = 235
seam = "free"

[[objects.meshes]]
match = { material = "Material__57" }
triangles = 155
seam = "free"

[[objects.meshes]]
match = { material = "vase_hanging" }
triangles = 19
seam = "free"

[[objects.meshes]]
match = { material = "leaf" }
triangles = 45
seam = "free"

[[objects.meshes]]
match = { material = "Material__298" }
triangles = 484
seam = "free"

[[objects.meshes]]
match = { material = "Material__47" }
triangles = 45
seam = "free"

# Chains budget one triangle per copy to leave room for walls and arches.
[[objects.meshes]]
match = { material = "chain" }
triangles = 1
seam = "free"

# The variant's triangles budget the rest, apart from its props and cards, and
# are its fit's budget, so a probe fit stays closed (Appearance-Fit.md); its
# ceiling caps the rest plus every stored copy prototype. Unpinned free
# repeats derive their detail from the camera's closest view within that
# ceiling. 12716 is the 13313 this variant had before the drape's two skins
# collapsed to one sheet, less the 597 start triangles that saved the fabric
# (2110 to 1513): spent elsewhere, they let the fit move columns over the
# plants in held-out views.
[[variants]]
name = "sponza_fitted_full"
triangles = 12716
objects_scale = 0.92
ceiling = 30000
