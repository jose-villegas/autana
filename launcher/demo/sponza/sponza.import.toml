[source]
path = "source/sponza.obj"
credit = "Crytek Sponza (Frank Meinl, Crytek; CC BY 3.0), from the OBJ in McGuire's Computer Graphics Archive, casual-effects.com/data."

[output]
position_scale = 8

[materials]
double_sided = ["fabric_a", "fabric_c", "fabric_d", "fabric_e", "fabric_f", "fabric_g", "leaf", "chain", "Material__57"]

[process]
seed = 1

[geometry]
alpha_mask = { keep_alpha = 0.5 }
simplify = { dense_edge = 45.0, props = [], props_share = 0.0, seal_seams = true, colour_deviation = 1.0 }

# Free-standing props share one mesh per repeated shape; each copy draws
# `triangles` times its variant's objects_scale.
# The flagpoles stay in the rest: each passes
# through the wall, and a carved pole too thin to fill its socket shows sky
# around it. Seams are free: a locked contact keeps every copy's
# border vertices, which a prop of a few dozen triangles cannot afford.
[[objects.meshes]]
match = { material = "vase" }
triangles = 235
seam = "free"

[[objects.meshes]]
match = { material = "Material__57" }
triangles = 155
seam = "free"

[[objects.meshes]]
match = { material = "vase_hanging" }
triangles = 19
seam = "free"

[[objects.meshes]]
match = { material = "Material__298" }
triangles = 484
seam = "free"

[[objects.meshes]]
match = { material = "Material__47" }
triangles = 45
seam = "free"

# Chains budget one triangle per copy to leave room for walls and arches.
[[objects.meshes]]
match = { material = "chain" }
triangles = 1
seam = "free"

# Each variant budgets the rest separately from its props and cards.
# The fitted variants scale their props lower; the fit's prune
# (sponza.scene.toml) keeps the rest triangles the camera sees.
[[variants]]
name = "sponza"
triangles = 12948
ceiling = 17381

[[variants]]
name = "sponza_lite"
triangles = 6436
objects_scale = 0.5
ceiling = 8672

[[variants]]
name = "sponza_fitted"
triangles = 11188
objects_scale = 0.43
ceiling = 13500

[[variants]]
name = "sponza_fitted_full"
triangles = 25491
objects_scale = 0.92
ceiling = 30000
