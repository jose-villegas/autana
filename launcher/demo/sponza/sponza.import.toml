[source]
path = "source/sponza.obj"
credit = "Crytek Sponza (Frank Meinl, Crytek; CC BY 3.0), from the OBJ in McGuire's Computer Graphics Archive, casual-effects.com/data."

[output]
position_scale = 8

[materials]
double_sided = ["fabric_a", "fabric_c", "fabric_d", "fabric_e", "fabric_f", "fabric_g", "leaf", "chain", "Material__57"]

[process]
seed = 1

[geometry]
alpha_mask = { keep_alpha = 0.5 }
thin = { material = "leaf", keep = 0.35 }
simplify = { dense_edge = 45.0, props = [], props_share = 0.0, seal_seams = true, colour_deviation = 1.0 }

# The free-standing props: one mesh per repeated shape, each copy drawing
# `triangles` (as many as the old pooled props share gave it) times its
# variant's objects_scale. Chains stay in the rest: the pooled share gave
# them none. Seams are free: a locked contact keeps every copy's border
# vertices, which a prop of a few dozen triangles cannot afford.
[[objects.meshes]]
match = { material = "vase" }
triangles = 235
seam = "free"

[[objects.meshes]]
match = { material = "Material__57" }
triangles = 155
seam = "free"

[[objects.meshes]]
match = { material = "vase_hanging" }
triangles = 19
seam = "free"

[[objects.meshes]]
match = { material = "flagpole" }
triangles = 22
seam = "free"

[[objects.meshes]]
match = { material = "leaf" }
triangles = 45
seam = "free"

[[objects.meshes]]
match = { material = "Material__298" }
triangles = 484
seam = "free"

[[objects.meshes]]
match = { material = "Material__47" }
triangles = 45
seam = "free"

# Each variant's triangles budget the rest; the props add 5429 at
# objects_scale 1 and 2726 at 0.5, so each ceiling is the old total.
[[variants]]
name = "sponza"
triangles = 11952
ceiling = 17381

[[variants]]
name = "sponza_lite"
triangles = 5946
objects_scale = 0.5
ceiling = 8672

[[variants]]
name = "sponza_fitted"
triangles = 10774
objects_scale = 0.5
ceiling = 13500

[[variants]]
name = "sponza_fitted_full"
triangles = 24571
ceiling = 30000
