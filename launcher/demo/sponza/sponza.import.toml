[source]
path = "source/sponza.obj"
credit = "Crytek Sponza (Frank Meinl, Crytek; CC BY 3.0), from the OBJ in McGuire's Computer Graphics Archive, casual-effects.com/data."

[output]
position_scale = 8

[materials]
double_sided = ["fabric_a", "fabric_c", "fabric_d", "fabric_e", "fabric_f", "fabric_g", "leaf", "chain", "Material__57"]

[process]
seed = 1

[geometry]
alpha_mask = { keep_alpha = 0.5 }
thin = { material = "leaf", keep = 0.35 }
simplify = { dense_edge = 45.0, props = [], props_share = 0.0, seal_seams = true, colour_deviation = 1.0 }
# The fits train on probes over the whole atrium (the scene camera has no path).
probes = {}

# The props and drapes have one mesh per shape, each copy drawing
# `triangles` times the variant's objects_scale. A flagpole through the wall
# stays in the rest, since a carved pole too thin to fill its socket shows
# sky around it. Free flagpoles are carved as free repeats (20 of the 46).
# Seams are free, since a locked contact keeps border vertices that a prop
# of a few dozen triangles cannot afford.
[[objects.meshes]]
match = { material = "vase" }
triangles = 235
seam = "free"

[[objects.meshes]]
match = { material = "Material__57" }
triangles = 155
seam = "free"

[[objects.meshes]]
match = { material = "vase_hanging" }
triangles = 19
seam = "free"

[[objects.meshes]]
match = { material = "leaf" }
triangles = 45
seam = "free"

[[objects.meshes]]
match = { material = "Material__298" }
triangles = 484
seam = "free"

[[objects.meshes]]
match = { material = "Material__47" }
triangles = 45
seam = "free"

# Chains budget one triangle per copy to leave room for walls and arches.
[[objects.meshes]]
match = { material = "chain" }
triangles = 1
seam = "free"

# The rest's 12716 start triangles include 1448 assigned to fabric across
# 18 pieces, by nearest source triangle per rest triangle. At objects_scale
# 0.92, a rule of 87 gives 80 triangles per piece, about 1448 / 18.
[[objects.meshes]]
match = { material = "fabric_*" }
triangles = 87
seam = "free"

# The variant's triangles budget the fit over the rest. Its ceiling caps
# the rest plus every stored copy prototype. Unpinned free repeats derive
# their detail from the camera's closest view within that ceiling.
#
# The total is 12716 (13313 less the 597 triangles saved by collapsing each
# drape's two skins to one sheet), leaving those triangles unspent to keep
# the fit's columns off the plants in held-out views.
# The rest gets 12716 - 1448 = 11268 to keep the finest drawn total.
# Carve rules have no share key, so recompute both budgets if the variant's
# budget changes.
[[variants]]
name = "sponza_fitted_full"
triangles = 11268
objects_scale = 0.92
ceiling = 30000
