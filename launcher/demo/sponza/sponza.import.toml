[source]
path = "source/sponza.obj"
credit = "Crytek Sponza (Frank Meinl, Crytek; CC BY 3.0), from the OBJ in McGuire's Computer Graphics Archive, casual-effects.com/data."

[output]
position_scale = 8

[materials]
double_sided = ["fabric_a", "fabric_c", "fabric_d", "fabric_e", "fabric_f", "fabric_g", "leaf", "chain", "Material__57"]

[process]
seed = 1

[geometry]
alpha_mask = { keep_alpha = 0.5 }
thin = { material = "leaf", keep = 0.35 }
simplify = { dense_edge = 45.0, seal_seams = true, colour_deviation = 1.0 }
# The fits train on probes over the whole atrium (the scene camera has no path).
probes = {}

# Free seams let carved props simplify independently. Repeats touching
# nothing also carve automatically, while poles crossing walls stay in the rest.
[[objects.meshes]]
match = { material = "vase" }
seam = "free"

[[objects.meshes]]
match = { material = "Material__57" }
seam = "free"

[[objects.meshes]]
match = { material = "vase_hanging" }
seam = "free"

[[objects.meshes]]
match = { material = "leaf" }
seam = "free"

[[objects.meshes]]
match = { material = "Material__298" }
seam = "free"

[[objects.meshes]]
match = { material = "Material__47" }
seam = "free"

[[objects.meshes]]
match = { material = "chain" }
seam = "free"

[[variants]]
name = "sponza_fitted_full"
triangles = 33225
ceiling = 30000
