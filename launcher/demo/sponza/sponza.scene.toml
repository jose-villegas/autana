# The reference scene shares one light rig and camera across its baked variants.
tonemap_white = 0.35

[sky]
color = [0.55, 0.68, 0.9]
intensity = 0.9
rays = 48

[ambient]
color = [1.0, 1.0, 1.0]
intensity = 0.005

[indirect]
intensity = 2.0

[bake]
ray_offset = 0.5
colour_merge_step = 6
indirect = { bounces = 2, rays = 64 }
ao = { distance = 40.0, rays = 32, indirect = true }

[[objects]]
name = "sun"
rotation = [22.450814295724417, -37.230418121890686, 0.0]   # toward (-0.25, 1.0, 0.329)

[objects.light]
type = "directional"
color = [1.0, 0.92, 0.78]
intensity = 3.0

[[objects]]
name = "camera"

[objects.camera]
half_fov_short_tan = 0.62
near_z = 6.0
background = 0x9CC0E6
region = { min = [-1400.0, 20.0, -620.0], max = [1270.0, 1250.0, 550.0] }
path = { animation = "flythrough.anim.toml", node = "camera" }

[[objects]]
name = "tour"

[objects.camera]
half_fov_short_tan = 0.62
near_z = 6.0
background = 0x9CC0E6
path = { animation = "tour.anim.toml", node = "camera" }

[[objects]]
name = "atrium"

[objects.mesh_renderer]
mesh = "sponza.import.toml"
variant = "sponza"
bake = true
visibility = { source = "camera_region", rounds = 160 }

[[objects]]
name = "atrium_flat"

[objects.mesh_renderer]
mesh = "sponza.import.toml"
variant = "sponza"
bake = true
shading = { flat = { auto = { min = 1, max = 16, area = "median" } } }
visibility = { source = "camera_region", rounds = 160 }

[[objects]]
name = "atrium_lite"

[objects.mesh_renderer]
mesh = "sponza.import.toml"
variant = "sponza_lite"
bake = true
visibility = { source = "camera_region", rounds = 160 }

[[objects]]
name = "atrium_fitted"

[objects.mesh_renderer]
mesh = "sponza.import.toml"
variant = "sponza_fitted"
bake = true
visibility = { source = "camera_path", every_ms = 100, size = [184, 224], samples = 3, margin = 8 }

[objects.mesh_renderer.fit.prune]
budget = 8672
coverage_every_ms = 100

[objects.mesh_renderer.fit.poses]
train_every_ms = 1000
held_out_every_ms = 5000

[objects.mesh_renderer.fit.optimise]
steps = 2000
batch = 8
laplacian = 10.0
normal_weight = 1.0


[[objects]]
name = "atrium_fitted_full"

[objects.mesh_renderer]
mesh = "sponza.import.toml"
variant = "sponza_fitted_full"
bake = true
visibility = { source = "camera_path", every_ms = 100, size = [184, 224], samples = 3, margin = 8 }

[objects.mesh_renderer.fit.prune]
budget = 17381
coverage_every_ms = 100

[objects.mesh_renderer.fit.poses]
train_every_ms = 1000
held_out_every_ms = 5000

[objects.mesh_renderer.fit.optimise]
steps = 2000
batch = 8
laplacian = 10.0
normal_weight = 1.0


[[objects]]
name = "atrium_flat_fitted"

[objects.mesh_renderer]
mesh = "sponza.import.toml"
variant = "sponza_fitted_full"
bake = true
shading = { flat = { auto = { min = 1, max = 16, area = "median" } } }
visibility = { source = "camera_path", every_ms = 100, size = [184, 224], samples = 3, margin = 8 }

[objects.mesh_renderer.fit.prune]
budget = 17381
coverage_every_ms = 100

[objects.mesh_renderer.fit.poses]
train_every_ms = 1000
held_out_every_ms = 5000

[objects.mesh_renderer.fit.optimise]
steps = 2000
batch = 8
laplacian = 10.0
normal_weight = 1.0

