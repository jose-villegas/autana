# The reference scene: one light rig and camera, and one fitted renderer.
tonemap_white = 0.35

[sky]
color = [0.55, 0.68, 0.9]
intensity = 0.9
rays = 48

[ambient]
color = [1.0, 1.0, 1.0]
intensity = 0.005

[indirect]
intensity = 2.0

[bake]
ray_offset = 0.5
colour_merge_step = 6
indirect = { bounces = 2, rays = 64 }
ao = { distance = 40.0, rays = 32, indirect = true }
# The fit's references, traced with every hemisphere term turned per point (docs/render/scene/Scene-Files.md#bake-reference-traces);
# no vertex bake reads these two.
aa_samples = 4      # 4 x 4 rays per pixel
denoise = true      # OIDN with albedo + normal guides

[[objects]]
name = "sun"
rotation = [25.0, -47.5, 0.0]   # toward (-0.344, 1.0, 0.315)

[objects.light]
type = "directional"
mode = "baked"
color = [1.0, 0.92, 0.78]
intensity = 3.0

# The scene camera: anywhere in the atrium, on no path. The fits train on
# probes spread through its region (geometry.probes), so no flight shapes them.
[[objects]]
name = "visitor"

[objects.camera]
half_fov_short_tan = 0.62
near_z = 6.0
background = 0x9CC0E6
region = { min = [-1400.0, 20.0, -620.0], max = [1270.0, 1250.0, 550.0] }

[[objects]]
name = "camera"

[objects.camera]
half_fov_short_tan = 0.62
near_z = 6.0
background = 0x9CC0E6
path = { animation = "flythrough.anim.toml", node = "camera" }

[[objects]]
name = "tour"

[objects.camera]
half_fov_short_tan = 0.62
near_z = 6.0
background = 0x9CC0E6
path = { animation = "tour.anim.toml", node = "camera" }

[[objects]]
name = "lion"

[objects.camera]
half_fov_short_tan = 0.62
near_z = 6.0
background = 0x9CC0E6
path = { animation = "lion.anim.toml", node = "camera" }

[[objects]]
name = "atrium_fitted_full"

[objects.mesh_renderer]
mesh = "sponza.import.toml"
variant = "sponza_fitted_full"
bake = true
visibility = { source = "camera_region", rounds = 160 }

[objects.mesh_renderer.fit.prune]
coverage_every_ms = 20

[objects.mesh_renderer.fit.poses]
size = [184, 224]
train_every_ms = 1000
held_out_every_ms = 5000

[objects.mesh_renderer.fit.optimise]
steps = 2000
batch = 8
laplacian = 10.0
surface_weight = 10.0
surface_margin = 0.25
normal_weight = 1.0

