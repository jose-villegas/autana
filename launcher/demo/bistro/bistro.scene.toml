# An open street with a far plane: a plaza and a long lane, walked at eye
# height. Model units are centimetres; y is up.
tonemap_white = 0.35

[sky]
color = [0.55, 0.68, 0.9]
intensity = 0.9
rays = 48

[ambient]
color = [1.0, 1.0, 1.0]
intensity = 0.005

[indirect]
intensity = 2.0

[bake]
ray_offset = 0.5
colour_merge_step = 6
indirect = { bounces = 2, rays = 64 }
ao = { distance = 40.0, rays = 32, indirect = true }

[[objects]]
name = "sun"
rotation = [40.0, -60.0, 0.0]

[objects.light]
type = "directional"
color = [1.0, 0.92, 0.78]
intensity = 3.0

[[objects]]
name = "camera"

[objects.camera]
half_fov_short_tan = 0.62
near_z = 6.0
background = 0x9CC0E6
path = { animation = "street.anim.toml", node = "camera" }

[[objects]]
name = "street"

[objects.mesh_renderer]
mesh = "bistro.import.toml"
variant = "bistro"
bake = true
visibility = { source = "camera_path", every_ms = 500, size = [184, 224] }

[[objects]]
name = "street_lite"

[objects.mesh_renderer]
mesh = "bistro.import.toml"
variant = "bistro_lite"
bake = true
visibility = { source = "camera_path", every_ms = 500, size = [184, 224] }

[[objects]]
name = "ground"

[objects.mesh_renderer]
mesh = "ground.import.toml"
bake = true
