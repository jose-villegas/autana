# An open street with a far plane: a plaza and a long lane, walked at eye
# height and flown over the roofs, on ground that reaches the horizon. Model
# units are centimetres; y is up. Fitted renderers come first, the standard
# fitted full at the top, as in the Sponza scene.
tonemap_white = 0.35

[sky]
color = [0.55, 0.68, 0.9]
intensity = 0.9
rays = 48

[ambient]
color = [1.0, 1.0, 1.0]
intensity = 0.005

[indirect]
intensity = 2.0

[bake]
# The source's reduction error (source/copyright.txt): its thin two-shell
# awnings cross by up to that much, and a smaller offset lets one shell shadow
# the other.
ray_offset = 5.0
colour_merge_step = 6
indirect = { bounces = 2, rays = 64 }
ao = { distance = 40.0, rays = 32, indirect = true }

[[objects]]
name = "sun"
rotation = [40.0, -60.0, 0.0]

[objects.light]
type = "directional"
color = [1.0, 0.92, 0.78]
intensity = 3.0

[[objects]]
name = "camera"

[objects.camera]
half_fov_short_tan = 0.62
near_z = 6.0
background = 0x9CC0E6
path = { animation = "street.anim.toml", node = "camera" }

[[objects]]
name = "street_fitted_full"

[objects.mesh_renderer]
mesh = "bistro.import.toml"
variant = "bistro_fitted_full"
bake = true
visibility = { source = "camera_path", every_ms = 500, size = [184, 224] }

[objects.mesh_renderer.fit.prune]
budget = 18678
coverage_every_ms = 20

[objects.mesh_renderer.fit.poses]
size = [184, 224]
train_every_ms = 1000
held_out_every_ms = 5000

[objects.mesh_renderer.fit.optimise]
steps = 2000
batch = 8
laplacian = 10.0
surface_weight = 10.0
surface_margin = 0.25
normal_weight = 1.0

[[objects]]
name = "street_fitted"

[objects.mesh_renderer]
mesh = "bistro.import.toml"
variant = "bistro_fitted"
bake = true
visibility = { source = "camera_path", every_ms = 500, size = [184, 224] }

[objects.mesh_renderer.fit.prune]
budget = 9350
coverage_every_ms = 20

[objects.mesh_renderer.fit.poses]
size = [184, 224]
train_every_ms = 1000
held_out_every_ms = 5000

[objects.mesh_renderer.fit.optimise]
steps = 2000
batch = 8
laplacian = 10.0
surface_weight = 10.0
surface_margin = 0.25
normal_weight = 1.0

[[objects]]
name = "street_flat_fitted"

[objects.mesh_renderer]
mesh = "bistro.import.toml"
variant = "bistro_fitted_full"
bake = true
shading = { flat = { auto = { min = 1, max = 16, area = "median" } } }
visibility = { source = "camera_path", every_ms = 500, size = [184, 224] }

[objects.mesh_renderer.fit.prune]
budget = 18678
coverage_every_ms = 20

[objects.mesh_renderer.fit.poses]
size = [184, 224]
train_every_ms = 1000
held_out_every_ms = 5000

[objects.mesh_renderer.fit.optimise]
steps = 2000
batch = 8
laplacian = 10.0
surface_weight = 10.0
surface_margin = 0.25
normal_weight = 1.0

[[objects]]
name = "street"

[objects.mesh_renderer]
mesh = "bistro.import.toml"
variant = "bistro"
bake = true
visibility = { source = "camera_path", every_ms = 500, size = [184, 224] }

[[objects]]
name = "street_lite"

[objects.mesh_renderer]
mesh = "bistro.import.toml"
variant = "bistro_lite"
bake = true
visibility = { source = "camera_path", every_ms = 500, size = [184, 224] }

[[objects]]
name = "street_flat"

[objects.mesh_renderer]
mesh = "bistro.import.toml"
variant = "bistro"
bake = true
shading = { flat = { auto = { min = 1, max = 16, area = "median" } } }
visibility = { source = "camera_path", every_ms = 500, size = [184, 224] }

[[objects]]
name = "ground"

[objects.mesh_renderer]
mesh = "ground.import.toml"
bake = true
