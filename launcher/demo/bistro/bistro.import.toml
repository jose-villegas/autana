[source]
path = "source/bistro.obj"
credit = "Amazon Lumberyard Bistro, exterior (Amazon Lumberyard; CC BY 4.0), from NVIDIA's Open Research Content Archive; reduced, see source/copyright.txt."

[output]
position_scale = 4

[materials]
double_sided = ["Foliage_Bux_Hedges46.DoubleSided", "Foliage_Flowers.DoubleSided"]

[process]
seed = 1

[geometry]
alpha_mask = { keep_alpha = 0.5 }
thin = { material = "Foliage_Paris_Flowers", keep = 0.3 }
simplify = { dense_edge = 300.0, props = ["Streetlight_Metal"], props_share = 0.13, seal_seams = false, colour_deviation = 2.0 }

# The free-standing props: one mesh per repeated shape, each copy drawing
# `triangles` times its variant's objects_scale. Together they take the old
# pooled props share in proportion to source triangles; the streetlights stay
# pooled in the rest, since their objects carry the string lights between
# the buildings.
[[objects.meshes]]
match = { material = "Paris_Chair_01" }
triangles = 35
seam = "free"

[[objects.meshes]]
match = { material = "Paris_Table_Terrace" }
triangles = 24
seam = "free"

[[objects.meshes]]
match = { material = "Trashcan" }
triangles = 118
seam = "free"

[[objects.meshes]]
match = { material = "Vespa" }
triangles = 124
seam = "free"

[[objects.meshes]]
match = { material = "Bollards" }
triangles = 15
seam = "free"

[[objects.meshes]]
match = { material = "Paris_TrafficSign_A" }
triangles = 10
seam = "free"

[[objects.meshes]]
match = { material = "Paris_StreetSign_01" }
triangles = 2
seam = "free"

# Each variant's triangles budget the rest; the props add 1596 at
# objects_scale 1 and 811 at 0.5, so each ceiling is the old total.
[[variants]]
name = "bistro"
triangles = 18404
ceiling = 20000

[[variants]]
name = "bistro_lite"
triangles = 9189
objects_scale = 0.5
ceiling = 10000

[[variants]]
name = "bistro_fitted"
triangles = 14689
objects_scale = 0.5
ceiling = 15500

[[variants]]
name = "bistro_fitted_full"
triangles = 32904
ceiling = 34500
