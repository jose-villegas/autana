[source]
path = "source/bistro.obj"
credit = "Amazon Lumberyard Bistro, exterior (Amazon Lumberyard; CC BY 4.0), from NVIDIA's Open Research Content Archive; reduced, see source/copyright.txt."

[output]
position_scale = 4

[materials]
double_sided = ["Foliage_Bux_Hedges46.DoubleSided", "Foliage_Flowers.DoubleSided"]

[process]
seed = 1

[geometry]
alpha_mask = { keep_alpha = 0.5 }
thin = { material = "Foliage_Paris_Flowers", keep = 0.3 }
simplify = { dense_edge = 300.0, props = ["Streetlight_Metal"], props_share = 0.13, seal_seams = false, colour_deviation = 2.0 }

# The free-standing props: one mesh per repeated shape. These rules name the
# props carved before; any other repeated object that touches nothing is
# carved without one. Each shape's detail is derived from the camera's
# closest view.
[[objects.meshes]]
match = { material = "Paris_Chair_01" }
seam = "free"

[[objects.meshes]]
match = { material = "Paris_Table_Terrace" }
seam = "free"

[[objects.meshes]]
match = { material = "Trashcan" }
seam = "free"

[[objects.meshes]]
match = { material = "Vespa" }
seam = "free"

[[objects.meshes]]
match = { material = "Bollards" }
seam = "free"

[[objects.meshes]]
match = { material = "Paris_TrafficSign_A" }
seam = "free"

[[objects.meshes]]
match = { material = "Paris_StreetSign_01" }
seam = "free"

# Each variant's triangles budget the rest; its ceiling caps the rest plus
# each carved shape once.
[[variants]]
name = "bistro"
triangles = 18678
ceiling = 20000

[[variants]]
name = "bistro_lite"
triangles = 9350
ceiling = 10000

[[variants]]
name = "bistro_fitted"
triangles = 14850
ceiling = 15500

[[variants]]
name = "bistro_fitted_full"
triangles = 33178
ceiling = 34500
