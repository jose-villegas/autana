# The stress scene: a camera swinging round the origin and a pool of copies.
# render_lab generates one mesh at run time, shows it in as many copies as
# the preset asks for and hides the rest; each copy starts as a stand-in.
[[objects]]
name = "camera"
position = [0.0, 1.0, 10.0]

[objects.camera]
half_fov_short_tan = 0.5
near_z = 0.5
background = 0x0B0D12
path = { animation = "orbit.anim.toml", node = "camera" }

[[objects]]
name = "slot_00"

[objects.mesh_renderer]
mesh = "slot.import.toml"

