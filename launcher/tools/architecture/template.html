<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Autana C4 Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* build.py fills the DATA constant below from the tree; edit this file, not its output. Layout: a full-height explorer; a pannable diagram canvas with a details panel beside it (below it on a phone). C4 colours: person, this system, container, component, external. */
:root {
  --bg: #eef1f0; --panel: #f9fbfa; --canvas: #ffffff; --fg: #17201d; --muted: #5b6863; --rule: #cfd8d4;
  --sys: #1d5d9b; --sys-fg: #ffffff;           /* this software system */
  --ctr: #3b7fc4; --ctr-fg: #ffffff;           /* container */
  --cmp: #dbe9f6; --cmp-fg: #10324f;           /* component */
  --ext: #8a949b; --ext-fg: #ffffff;           /* external system */
  --per: #0f3b66; --per-fg: #ffffff;           /* person */
  --hw: #a8601f;                                /* touches hardware */
  --sel: #e08a1e;                               /* selection */
  --edge: #6d7a75;
  --display: "IBM Plex Sans Condensed", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1413; --panel: #151c1a; --canvas: #111816; --fg: #e2eae6; --muted: #98a6a0; --rule: #2a3632;
  --sys: #2f78c0; --ctr: #2b5f94; --cmp: #1c3045; --cmp-fg: #d6e6f5; --ext: #4f5a60; --per: #1b4f82;
  --hw: #e09a55; --sel: #f0a640; --edge: #8a9893; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1413; --panel: #151c1a; --canvas: #111816; --fg: #e2eae6; --muted: #98a6a0; --rule: #2a3632;
  --sys: #2f78c0; --ctr: #2b5f94; --cmp: #1c3045; --cmp-fg: #d6e6f5; --ext: #4f5a60; --per: #1b4f82;
  --hw: #e09a55; --sel: #f0a640; --edge: #8a9893; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.5; }
.app { height: 100%; display: grid; grid-template-rows: auto 1fr; padding-inline: 16px; padding-block: 12px; gap: 10px; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; min-width: 0; }
.brand { font-family: var(--display); font-weight: 700; font-size: 20px; letter-spacing: .01em; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-family: var(--mono); font-size: 13px; min-width: 0; }
.crumbs button { font: inherit; background: none; border: 0; padding: 3px 6px; border-radius: 4px; color: var(--fg); cursor: pointer; }
.crumbs button:hover, .crumbs button:focus-visible { background: var(--panel); outline: 1px solid var(--rule); }
.crumbs .sep { color: var(--muted); }
.crumbs .lvl { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; margin-left: 4px; }
.tools { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin-left: auto; font-size: 13px; color: var(--muted); }
.tools label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 12px; min-height: 0; }
.stage { position: relative; background: var(--canvas); border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; min-height: 0; touch-action: none; }
.stage svg.diagram { width: 100%; height: 100%; display: block; cursor: grab; }
.stage svg.diagram.dragging { cursor: grabbing; }
.zoom { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 4px; }
.zoom button, .btn { font-family: var(--mono); font-size: 13px; background: var(--panel); color: var(--fg); border: 1px solid var(--rule); border-radius: 5px; padding: 5px 10px; cursor: pointer; }
.zoom button:hover, .btn:hover { border-color: var(--fg); }
.btn.primary { background: var(--sys); color: var(--sys-fg); border-color: var(--sys); }
.hint { position: absolute; left: 12px; bottom: 10px; font-size: 12px; color: var(--muted); background: var(--canvas); padding: 2px 6px; border-radius: 4px; }
.loading[hidden] { display: none; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-family: var(--mono); font-size: 13px; }
.panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; overflow: auto; min-height: 0; padding: 16px; display: grid; gap: 14px; align-content: start; }
.panel h2 { font-family: var(--display); font-weight: 700; font-size: 22px; margin: 0; line-height: 1.15; overflow-wrap: anywhere; }
.type { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.panel p { margin: 0; }
.stats { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-family: var(--mono); font-size: 12px; border: 1px solid var(--rule); border-radius: 999px; padding: 1px 9px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip.hw { border-color: var(--hw); color: var(--hw); }
.sec { display: grid; gap: 6px; }
.sec h3 { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; font-weight: 600; }
.rel { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; font-size: 14px; }
.rel button { font: inherit; text-align: left; background: none; border: 0; padding: 0; color: var(--sys); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; overflow-wrap: anywhere; }
.rel .n { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.files { display: grid; gap: 8px; }
.file { display: grid; gap: 1px; }
.file .nm { font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; }
.file .nm small { color: var(--muted); }
.file .sm { font-size: 13px; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.foot { font-size: 12px; color: var(--muted); }
/* mermaid output, themed from the tokens. A box carries one class, c4-<type>[_hw][_test]. */
.diagram .node[class*="c4-person"] rect, .diagram .node[class*="c4-person"] polygon { fill: var(--per) !important; stroke: var(--per) !important; }
.diagram .node[class*="c4-system"] rect { fill: var(--sys) !important; stroke: var(--sys) !important; }
.diagram .node[class*="c4-container"] rect { fill: var(--ctr) !important; stroke: var(--ctr) !important; }
.diagram .node[class*="c4-component"] rect { fill: var(--cmp) !important; stroke: var(--ctr) !important; }
.diagram .node[class*="c4-ext"] rect { fill: var(--ext) !important; stroke: var(--ext) !important; }
.diagram .node[class*="_hw"] rect { stroke: var(--hw) !important; stroke-width: 3px !important; }
.diagram .node[class*="_test"] rect { stroke-dasharray: 5 4 !important; }
.diagram .node .label, .diagram .node foreignObject div { font-family: var(--body) !important; }
.diagram .node .nlbl, .diagram .node .nlbl * { color: var(--ctr-fg) !important; }
.diagram .node[class*="c4-component"] .nlbl, .diagram .node[class*="c4-component"] .nlbl * { color: var(--cmp-fg) !important; }
.diagram .node { cursor: pointer; }
.diagram .node.selected rect { stroke: var(--sel) !important; stroke-width: 4px !important; }
.diagram .edgePath path, .diagram .flowchart-link { stroke: var(--edge) !important; }
.diagram marker path { fill: var(--edge) !important; stroke: var(--edge) !important; }
.diagram .edgeLabel, .diagram .edgeLabel p, .diagram .edgeLabel span { background-color: var(--canvas) !important; color: var(--fg) !important; }
.diagram .edgeLabel rect { fill: var(--canvas) !important; }
.diagram .cluster rect { fill: none !important; stroke: var(--rule) !important; stroke-dasharray: 4 4; }
.diagram .cluster-label, .diagram .cluster-label span, .diagram .cluster-label p { color: var(--muted) !important; font-family: var(--mono) !important; font-size: 11px !important; letter-spacing: .06em; }
.diagram .dim { opacity: .15; }
.diagram path.hot { stroke: var(--sel) !important; stroke-width: 2.5px !important; }
.diagram .node .nlbl, .diagram .node .nlbl * { color: var(--ctr-fg) !important; }
.diagram .node.c4-component .nlbl, .diagram .node.c4-component .nlbl * { color: var(--cmp-fg) !important; }
.nlbl { text-align: center; line-height: 1.25; padding: 2px 4px; }
.nlbl b { font-family: var(--display); font-size: 15px; font-weight: 700; display: block; }
.nlbl .t { font-family: var(--mono); font-size: 10.5px; opacity: .85; display: block; }
.nlbl .d { font-size: 11.5px; display: block; margin-top: 3px; max-width: 230px; white-space: normal; }
@media (max-width: 820px) {
  .app { height: auto; min-height: 100%; }
  .main { grid-template-columns: 1fr; }
  .stage { height: 62vh; }
  .tools { margin-left: 0; }
  .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <div class="brand">autana · C4</div>
    <nav class="crumbs" id="crumbs" aria-label="Level"></nav>
    <div class="tools" id="tools">
      <label><input type="checkbox" id="opt-ext" checked> ESP-IDF and microui</label>
      <label><input type="checkbox" id="opt-tests"> test suites</label>
      <label><input type="checkbox" id="opt-counts"> include counts</label>
    </div>
  </div>
  <div class="main">
    <div class="stage" id="stage">
      <div class="loading" id="loading">Drawing…</div>
      <div class="zoom">
        <button type="button" id="z-in" aria-label="Zoom in">+</button>
        <button type="button" id="z-out" aria-label="Zoom out">−</button>
        <button type="button" id="z-fit">fit</button>
      </div>
      <div class="hint">drag to pan · wheel or pinch to zoom · click a box</div>
    </div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/mermaid@12.1.0/dist/mermaid.min.js"></script>
<script>
const DATA = __DATA__;

/* ---------- the model ---------- */
const EXT = {
  "ext:ESP-IDF": ["ESP-IDF", "External system", "Espressif's framework: FreeRTOS, drivers, heap, esp_lcd, the BSP."],
  "ext:microui": ["microui", "External library", "Immediate-mode UI, vendored in launcher/components/ with its sizes cut down."],
};
const compById = Object.fromEntries(DATA.components.map(c => [c.id, c]));

function C(id, name, type, tech, desc, cls, extra) { return Object.assign({ id, name, type, tech, desc, cls }, extra || {}); }

const LEVELS = {
  context: {
    title: "System context", c4: "Level 1 · System context",
    nodes: [
      C("dev", "Developer", "Person", "", "Builds, flashes and tests the firmware; one maintainer.", "c4-person"),
      C("player", "Player", "Person", "", "Holds the device: picks an app on the launcher, taps, tilts.", "c4-person"),
      C("autana", "autana", "Software system", "", "A firmware shell for an ESP32-S3 AMOLED board that hosts self-contained apps and draws straight to the panel, plus the host tools around it.", "c4-system", { drill: "containers" }),
      C("board", "Waveshare ESP32-S3-Touch-AMOLED-1.8", "External hardware", "", "Dual-core Xtensa LX7, octal PSRAM, an AMOLED panel over QSPI, capacitive touch, an IMU and a PMU.", "c4-ext"),
      C("idf", "ESP-IDF", "External system", "", "Espressif's SDK and toolchain the firmware is built with.", "c4-ext"),
      C("ci", "GitHub Actions", "External system", "", "Builds the firmware images and runs host tests, QEMU tests and gates on pull requests. No board.", "c4-ext"),
      C("devrepo", "autana-dev", "External system", "", "The private dev repo mounted as .dev/: agent definitions, hardware datasheets and netlist, records, the beads backlog.", "c4-ext"),
    ],
    edges: [
      ["dev", "autana", "builds, flashes, tests"], ["player", "board", "taps, tilts"],
      ["autana", "board", "runs on"], ["autana", "idf", "built with"], ["ci", "autana", "builds and checks each PR"],
      ["dev", "devrepo", "notes, agents, backlog"],
    ],
  },
  containers: {
    title: "autana", c4: "Level 2 · Containers", parent: "context",
    nodes: [
      C("dev", "Developer", "Person", "", "Works from any shell; the board is reached only through autana.", "c4-person"),
      C("cli", "autana CLI", "Container", "sh, Python", "build, flash, monitor, screenshot, suite, tune, docs. Takes the device lock before opening the port.", "c4-container"),
      C("fw", "Firmware image", "Container", "C11, ESP-IDF, FreeRTOS", "The shell, its services and the apps, as release, dev or diag images.", "c4-container c4-hw", { drill: "firmware" }),
      C("pack", "Asset pack", "Container", "flash partition", "Baked meshes, scenes and animation tracks, mapped and read in place.", "c4-container c4-hw"),
      C("tests", "Host test runner", "Container", "C11, gcc/clang, Unity", "test/run_tests.sh: the portable sources and every suite over a board-sized heap model.", "c4-container"),
      C("render", "Render harness", "Container", "C11 host, sh", "tools/render: real screens rendered on a host, pinned by hash, watched for per-frame allocations.", "c4-container"),
      C("editor", "Layout editor", "Container", "C++17, SDL2, Dear ImGui", "editor/: links the firmware's gfx and ui to edit layouts live.", "c4-container"),
      C("gates", "Gates", "Container", "Python, Node", "scripts/gates: format, comment rules, style audit, layering, vendor code, maths, mermaid.", "c4-container"),
      C("board", "ESP32-S3 board", "External hardware", "", "The one board, on one serial port.", "c4-ext"),
      C("idf", "ESP-IDF", "External system", "", "SDK and toolchain.", "c4-ext"),
      C("ci", "GitHub Actions", "External system", "", "Runs the builds, tests and gates per PR.", "c4-ext"),
    ],
    edges: [
      ["dev", "cli", "runs"], ["cli", "fw", "builds"], ["cli", "board", "flashes, reads the console"],
      ["fw", "board", "runs on"], ["fw", "pack", "maps, reads in place"], ["fw", "idf", "built with"],
      ["tests", "fw", "compiles portable sources"], ["render", "fw", "compiles gfx, ui, app screens"],
      ["editor", "fw", "links gfx and ui"], ["gates", "fw", "check"], ["ci", "tests", "runs"], ["ci", "gates", "runs"],
    ],
  },
};

/* ---------- state ---------- */
const state = { level: "context", selected: null, ext: true, tests: false, counts: false };
const LEVEL_IDS = () => ["context", "containers", "firmware", ...DATA.components.map(c => "c:" + c.id)];
const hashOf = l => l.replace(/^c:/, "c-").replace(/\//g, ".");
const levelOfHash = h => { const l = h.replace(/^c-/, "c:").replace(/\./g, "/"); return LEVEL_IDS().includes(l) ? l : null; };

/* ---------- mermaid generation ---------- */
let N = 0; const idMap = {}; const revMap = {};
function mid(key) { if (!idMap[key]) { idMap[key] = "n" + (N++); revMap[idMap[key]] = key; } return idMap[key]; }
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "#quot;");
function label(name, type, tech, desc) {
  const t = type + (tech ? ": " + tech : "");
  return `<div class='nlbl'><b>${esc(name)}</b><span class='t'>[${esc(t)}]</span>${desc ? `<span class='d'>${esc(desc)}</span>` : ""}</div>`;
}

function firmwareModel() {
  const nodes = [], edges = [];
  for (const c of DATA.components) {
    if (c.id === "suites" && !state.tests) continue;
    const cls = ["c4-component"]; if (c.hw) cls.push("c4-hw"); if (c.id === "suites") cls.push("c4-test");
    nodes.push(C(c.id, c.name, "Component", `${c.files.length} files · ${c.lines.toLocaleString()} lines`, c.desc, cls.join(" "),
      { drill: "c:" + c.id, comp: c }));
  }
  if (state.ext) for (const k in EXT) nodes.push(C(k, EXT[k][0], EXT[k][1], "", EXT[k][2], "c4-ext"));
  const have = new Set(nodes.map(n => n.id));
  for (const e of DATA.edges) if (have.has(e.from) && have.has(e.to))
    edges.push([e.from, e.to, state.counts ? String(e.n) : "", e.n, e.to === "contract"]);
  return { title: "Firmware image", c4: "Level 3 · Components", parent: "containers", nodes, edges };
}

function codeModel(cid) {
  const c = compById[cid];
  const mods = new Map();
  for (const f of c.files) {
    const stem = f.name.replace(/\.(c|h)$/, "");
    const dir = f.path.split("/").slice(0, -1).join("/");
    const key = dir + "/" + stem;
    if (!mods.has(key)) mods.set(key, { key, stem, dir, files: [], lines: 0, summary: "" });
    const m = mods.get(key); m.files.push(f); m.lines += f.lines; if (!m.summary && f.summary) m.summary = f.summary;
  }
  const modOfFile = p => { const st = p.split("/").pop().replace(/\.(c|h)$/, ""); return p.split("/").slice(0, -1).join("/") + "/" + st; };
  const nodes = [], edges = new Map();
  for (const m of mods.values()) {
    const exts = m.files.map(f => f.name.slice(f.name.lastIndexOf("."))).sort().join(" ");
    const sub = m.dir.split("/").slice(cid.startsWith("apps/") ? 4 : 3).join("/");
    const desc = m.summary.length > 90 ? m.summary.slice(0, 88).replace(/\s+\S*$/, "") + "…" : m.summary;
    nodes.push(C(m.key, m.stem, "Code", (sub ? sub + "/ · " : "") + exts + " · " + m.lines + " lines", desc, "c4-component", { mod: m }));
  }
  const ext = new Set();
  for (const e of DATA.fileEdges[cid] || []) {
    const from = modOfFile(e.from);
    let to;
    if (e.to.startsWith("@")) { to = e.to.slice(1); if (to.startsWith("ext:") && !state.ext) continue; ext.add(to); }
    else to = modOfFile(e.to);
    if (from === to || !mods.has(from)) continue;
    const k = from + "→" + to; edges.set(k, (edges.get(k) || 0) + e.n);
  }
  for (const x of ext) {
    if (x.startsWith("ext:")) nodes.push(C(x, EXT[x][0], EXT[x][1], "", "", "c4-ext"));
    else nodes.push(C(x, compById[x] ? compById[x].name : x, "Component", "", "", "c4-ext", { drill: "c:" + x }));
  }
  const E = [...edges].map(([k, n]) => { const [a, b] = k.split("→"); return [a, b, state.counts && ext.has(b) ? String(n) : "", n]; });
  return { title: c.name, c4: "Level 4 · Code", parent: "firmware", nodes, edges: E, lr: mods.size > 30 };
}

function modelFor(level) {
  if (LEVELS[level]) return LEVELS[level];
  if (level === "firmware") return firmwareModel();
  return codeModel(level.slice(2));
}

function toMermaid(m) {
  const lines = [`flowchart ${m.lr ? "LR" : "TB"}`];
  const nodeLine = n => `  ${mid(n.id)}["${label(n.name, n.type, n.tech, n.desc)}"]`;
  for (const n of m.nodes) lines.push(nodeLine(n));
  for (const [a, b, l, , quiet] of m.edges) if (!quiet) lines.push(`  ${mid(a)} -->${l ? `|${esc(l)}|` : ""} ${mid(b)}`);
  for (const n of m.nodes) {
    const [base, ...mods] = n.cls.split(" ");
    lines.push(`  class ${mid(n.id)} ${base}${mods.map(x => "_" + x.replace(/^c4-/, "")).join("")}`);
  }
  return lines.join("\n");
}

/* ---------- rendering, pan and zoom ---------- */
const stage = document.getElementById("stage");
let svg = null, vb = null, home = null, model = null, renderSeq = 0;

function themeVars() {
  const cs = getComputedStyle(document.documentElement);
  const v = k => cs.getPropertyValue(k).trim();
  return { background: v("--canvas"), primaryColor: v("--cmp"), primaryTextColor: v("--fg"), lineColor: v("--edge"),
           fontFamily: "Atkinson Hyperlegible, system-ui, sans-serif", fontSize: "13px" };
}

async function render() {
  const seq = ++renderSeq;
  model = modelFor(state.level);
  document.getElementById("loading").hidden = false;
  try {
    mermaid.initialize({ startOnLoad: false, securityLevel: "loose", theme: "base", themeVariables: themeVars(),
      flowchart: { htmlLabels: true, curve: "basis", nodeSpacing: 34, rankSpacing: 60, padding: 10, wrappingWidth: 260 } });
    const { svg: out } = await mermaid.render("c4d" + seq, toMermaid(model));
    if (seq !== renderSeq) return;
    stage.querySelector("svg.diagram")?.remove();
    stage.insertAdjacentHTML("afterbegin", out);
    svg = stage.querySelector("svg");
    svg.classList.add("diagram");
    svg.removeAttribute("style"); svg.removeAttribute("width"); svg.removeAttribute("height");
    svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
    home = svg.viewBox.baseVal ? [svg.viewBox.baseVal.x, svg.viewBox.baseVal.y, svg.viewBox.baseVal.width, svg.viewBox.baseVal.height] : [0, 0, 1000, 800];
    vb = startView(); apply();
    markSelection();
  } catch (err) {
    stage.querySelector("svg.diagram")?.remove();
    document.getElementById("loading").textContent = "This diagram could not be drawn: " + (err.message || err);
    return;
  }
  document.getElementById("loading").hidden = true;
}

/* Fit when the whole diagram stays readable; otherwise start at a readable
 * scale from its top, centred, and let the reader pan. */
const MIN_SCALE = 0.62;
function startView() {
  const r = stage.getBoundingClientRect();
  const s = Math.min(r.width / home[2], r.height / home[3]);
  if (s >= MIN_SCALE) return home.slice();
  const w = r.width / MIN_SCALE, hgt = r.height / MIN_SCALE;
  return [home[0] + (home[2] - w) / 2, home[1], w, hgt];
}
function apply() { if (svg) svg.setAttribute("viewBox", vb.join(" ")); }
function zoomAt(f, cx, cy) {
  const r = svg.getBoundingClientRect();
  const s = Math.max(vb[2] / r.width, vb[3] / r.height);
  const ox = (r.width - vb[2] / s) / 2, oy = (r.height - vb[3] / s) / 2;
  const px = vb[0] + (cx - r.left - ox) * s, py = vb[1] + (cy - r.top - oy) * s;
  const nw = Math.min(Math.max(vb[2] * f, home[2] / 12), home[2] * 4), k = nw / vb[2];
  vb = [px - (px - vb[0]) * k, py - (py - vb[1]) * k, nw, vb[3] * k]; apply();

let drag = null, moved = false; const pts = new Map();
stage.addEventListener("pointerdown", e => {
  if (!svg || e.target.closest("button")) return;
  pts.set(e.pointerId, [e.clientX, e.clientY]);
  if (pts.size === 1) { drag = { x: e.clientX, y: e.clientY, vb: vb.slice() }; moved = false; }
});
addEventListener("pointermove", e => {
  if (!pts.has(e.pointerId)) return;
  const prev = pts.get(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]);
  if (pts.size === 2) {
    const [a, b] = [...pts.values()]; const [pa] = [...pts.entries()].filter(([id]) => id !== e.pointerId).map(x => x[1]);
    const d1 = Math.hypot(prev[0] - pa[0], prev[1] - pa[1]), d2 = Math.hypot(a[0] - b[0], a[1] - b[1]);
    if (d1 > 0 && d2 > 0) zoomAt(d1 / d2, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2);
    moved = true; return;
  }
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 4) { moved = true; svg.classList.add("dragging"); }
  const r = svg.getBoundingClientRect(); const s = Math.max(drag.vb[2] / r.width, drag.vb[3] / r.height);
  vb = [drag.vb[0] - dx * s, drag.vb[1] - dy * s, drag.vb[2], drag.vb[3]]; apply();
});
const end = e => { pts.delete(e.pointerId); if (pts.size === 0) { drag = null; svg?.classList.remove("dragging"); } };
addEventListener("pointerup", end); addEventListener("pointercancel", end);
stage.addEventListener("click", e => { if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
stage.addEventListener("wheel", e => { if (!svg) return; e.preventDefault(); zoomAt(e.deltaY > 0 ? 1.15 : 1 / 1.15, e.clientX, e.clientY); }, { passive: false });
document.getElementById("z-in").onclick = () => { const r = svg.getBoundingClientRect(); zoomAt(1 / 1.3, r.left + r.width / 2, r.top + r.height / 2); };
document.getElementById("z-out").onclick = () => { const r = svg.getBoundingClientRect(); zoomAt(1.3, r.left + r.width / 2, r.top + r.height / 2); };
document.getElementById("z-fit").onclick = () => { vb = home.slice(); apply(); };

/* ---------- selection and details ---------- */
stage.addEventListener("click", e => {
  const g = e.target.closest && e.target.closest("g.node");
  if (!g) { if (svg && e.target.closest("svg")) select(null); return; }
  const m = (g.id.match(/flowchart-(n\d+)-/) || [])[1];
  if (m) select(revMap[m]);
});
stage.addEventListener("dblclick", e => {
  const g = e.target.closest && e.target.closest("g.node"); if (!g) return;
  const n = nodeById(revMap[(g.id.match(/flowchart-(n\d+)-/) || [])[1]]); if (n?.drill) go(n.drill);
});
function nodeById(id) { return model.nodes.find(n => n.id === id); }
function select(id) { state.selected = id; markSelection(); renderPanel(); }
function markSelection() {
  if (!svg) return;
  const sel = state.selected ? idMap[state.selected] : null;
  const near = new Set();
  if (sel) { near.add(state.selected); for (const [a, b] of model.edges) { if (a === state.selected) near.add(b); if (b === state.selected) near.add(a); } }
  svg.querySelectorAll("g.node").forEach(g => {
    const key = revMap[(g.id.match(/flowchart-(n\d+)-/) || [])[1]];
    g.classList.toggle("selected", !!sel && key === state.selected);
    g.classList.toggle("dim", !!sel && !near.has(key));
  });
  svg.querySelectorAll("path[id*='L_'], path[data-id*='L_']").forEach(path => {
    const mm = (path.id || path.dataset.id || "").match(/L_(n\d+)_(n\d+)_/);
    if (!mm) return;
    const touches = sel && (revMap[mm[1]] === state.selected || revMap[mm[2]] === state.selected);
    path.classList.toggle("dim", !!sel && !touches);
    path.classList.toggle("hot", !!touches);
  });
  svg.querySelectorAll("g.edgeLabel").forEach(l => l.classList.toggle("dim", !!sel));
}
function go(level, selected) {
  state.level = level; state.selected = selected ?? null;
  try { history.replaceState(null, "", "#" + hashOf(level)); } catch (_) {}
  renderCrumbs(); renderPanel(); render();
  document.getElementById("tools").style.visibility = (level === "context" || level === "containers") ? "hidden" : "visible";
}
function renderCrumbs() {
  const path = []; let l = state.level;
  while (l) { const m = modelFor(l); path.unshift([l, m.title, m.c4]); l = m.parent; }
  const el = document.getElementById("crumbs"); el.innerHTML = "";
  path.forEach(([lv, t], i) => {
    if (i) el.insertAdjacentHTML("beforeend", "<span class='sep'>›</span>");
    const b = document.createElement("button"); b.type = "button"; b.textContent = t; b.onclick = () => go(lv);
    if (i === path.length - 1) b.setAttribute("aria-current", "page");
    el.appendChild(b);
  });
  el.insertAdjacentHTML("beforeend", `<span class='lvl'>${path[path.length - 1][2]}</span>`);
}
const h = (t, a = {}, ...kids) => { const e = document.createElement(t); for (const k in a) k === "class" ? e.className = a[k] : e.setAttribute(k, a[k]); kids.flat().forEach(k => e.append(k)); return e; };
function renderPanel() {
  const p = document.getElementById("panel"); p.innerHTML = "";
  const m = modelFor(state.level);
  const n = state.selected && m.nodes.find(x => x.id === state.selected);
  if (!n) {
    p.append(h("div", { class: "type" }, m.c4), h("h2", {}, m.title));
    const intro = {
      context: "autana and everything outside it: who uses it, what it runs on, what builds and checks it. Open autana to see its containers.",
      containers: "The separately built things that make up autana. The firmware image is the one that runs on the board; open it to see its components.",
      firmware: "One box per folder of launcher/main/, described as docs/Firmware-Architecture.md describes it. Arrows are #include directives between folders, read from the tree, so the layers show as rank: includes only point down. Includes of the root headers, which any layer may make, are listed in each box's relations instead of drawn. Select a box to see its relations and files; open it for its code.",
    }[state.level] || "Each box is a module: a .c and its .h. Arrows are #include directives; numbers count includes into other folders.";
    p.append(h("p", {}, intro));
    const lg = h("div", { class: "legend" });
    [["--per", "person"], ["--sys", "this system"], ["--ctr", "container"], ["--cmp", "component"], ["--ext", "external"]].forEach(([v, t]) => {
      const i = h("i"); i.style.background = `var(${v})`; i.style.border = "1px solid var(--rule)"; lg.append(h("span", {}, i, t));
    });
    const hw = h("i"); hw.style.border = "3px solid var(--hw)"; lg.append(h("span", {}, hw, "touches hardware"));
    p.append(lg);
    p.append(h("div", { class: "foot" }, `Built from jose-villegas/autana at ${DATA.source.commit} (${DATA.source.date}): ` + DATA.components.reduce((s, c) => s + c.files.length, 0) + " files, " + DATA.edges.length + " folder dependencies."));
    return;
  }
  p.append(h("div", { class: "type" }, "[" + n.type + (n.tech ? ": " + n.tech : "") + "]"), h("h2", {}, n.name));
  if (n.desc || n.mod?.summary) p.append(h("p", {}, n.mod ? n.mod.summary : n.desc));
  const chips = h("div", { class: "stats" });
  if (n.comp) { chips.append(h("span", { class: "chip" }, n.comp.files.length + " files"), h("span", { class: "chip" }, n.comp.lines.toLocaleString() + " lines")); if (n.comp.hw) chips.append(h("span", { class: "chip hw" }, "touches hardware")); }
  if (n.mod) chips.append(h("span", { class: "chip" }, n.mod.lines + " lines"));
  if (chips.childNodes.length) p.append(chips);
  if (n.drill) { const b = h("button", { class: "btn primary", type: "button" }, "Open " + n.name + " ›"); b.onclick = () => go(n.drill); p.append(h("div", {}, b)); }
  const rel = (title, list) => {
    if (!list.length) return;
    const g = h("div", { class: "rel" });
    list.sort((a, b) => (b[2] || 0) - (a[2] || 0)).forEach(([id, lbl, cnt]) => {
      const t = nodeById(id); const b = h("button", { type: "button" }, (t ? t.name : id) + (lbl && isNaN(+lbl) ? " — " + lbl : ""));

  rel("Uses", m.edges.filter(e => e[0] === n.id).map(e => [e[1], e[2], e[3]]));
  rel("Used by", m.edges.filter(e => e[1] === n.id).map(e => [e[0], e[2], e[3]]));

/* ---------- options, theme, start ---------- */
const opt = (id, key) => document.getElementById(id).addEventListener("change", e => { state[key] = e.target.checked; renderPanel(); render(); });
opt("opt-ext", "ext"); opt("opt-tests", "tests"); opt("opt-counts", "counts");
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => render());
new MutationObserver(() => render()).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
addEventListener("hashchange", () => { const l = levelOfHash(location.hash.slice(1)); if (l && l !== state.level) go(l); });
function start() {
  if (!window.mermaid) { document.getElementById("loading").textContent = "The diagram library did not load. Check the connection and reload."; return; }

}
start();
