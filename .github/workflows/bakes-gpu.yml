name: Bakes GPU

# The fits a branch's launcher/bakes.lock lacks (launcher/tools/bake/bake.py),
# made on the self-hosted CUDA runner, the maintainer's machine. Started only
# by hand on the branch, so no pull request's code reaches that machine on its
# own; then `bake.py lock --from-run N` with this run. A fit's start is locked
# first, from the Bakes run that made it, and fetched here by its bytes; fits
# that share their reference inputs share one reference set, which stays in the
# runner's cache. `again` re-makes fits the lock already has, to measure a fit
# against its locked bytes; those are never locked from this run. `probe`
# installs and bakes nothing: it reports whether Mitsuba's CUDA variant can
# trace on the runner (its driver, OptiX, one small render). Reference sets
# trace on that variant when it loads, else on the CPU. Under WSL 2 Dr.Jit
# finds OptiX only through the Linux driver's libnvoptix (Mitsuba's OptiX
# setup page); the runner keeps a copy in ~/gpu/optix, which only the steps
# that trace name, in their own environment.

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Space-separated outputs to fit (all missing fits when empty)'
        required: false
        default: ''
      again:
        description: 'Fit them even when the lock has them'
        type: boolean
        default: false
      probe:
        description: 'Only report whether Mitsuba CUDA traces here; bake nothing'
        type: boolean
        default: false

concurrency:
  group: bakes-gpu
  cancel-in-progress: false

# actions: read lets a fit fetch its locked start from the run that made it, before main publishes it.
permissions:
  contents: read
  actions: read

jobs:
  probe:
    name: Probe Mitsuba CUDA
    if: inputs.probe
    runs-on: [self-hosted, linux, gpu]
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Driver and OptiX
        run: |
          nvidia-smi --query-gpu=name,driver_version --format=csv
          ls -l /usr/lib/wsl/lib 2>/dev/null | grep -i -e optix -e libcuda || echo "no /usr/lib/wsl/lib OptiX or CUDA library"
          ls -l "$HOME/gpu/optix" 2>/dev/null || echo "no ~/gpu/optix: reference sets trace on the CPU"

      - name: One small render on cuda_ad_rgb
        run: |
          export DRJIT_LIBOPTIX_PATH="$HOME/gpu/optix/libnvoptix.so.1" LD_LIBRARY_PATH="$HOME/gpu/optix"
          sh launcher/tools/r3d/gpu_python.sh launcher/tools/r3d/mitsuba_probe.py

  gpu:
    name: Bake missing fits
    if: ${{ !inputs.probe }}
    runs-on: [self-hosted, linux, gpu]
    timeout-minutes: 600
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Fetch mesh source files
        run: git lfs pull --exclude=""

      - name: Initialize only meshoptimizer
        run: git submodule update --init --depth 1 third_party/upstream/meshoptimizer

      - name: Install the r3d requirements into the GPU environment
        run: |
          "$HOME/gpu/env/bin/python" -m pip install -r launcher/tools/r3d/requirements.txt

      - name: Bake
        env:
          ONLY: ${{ inputs.only }}
          AGAIN: ${{ inputs.again }}
          GH_TOKEN: ${{ github.token }}
        run: |
          export DRJIT_LIBOPTIX_PATH="$HOME/gpu/optix/libnvoptix.so.1" LD_LIBRARY_PATH="$HOME/gpu/optix"
          args=(--kind fit --out "$RUNNER_TEMP/bakes")
          for name in $ONLY; do args+=(--only "$name"); done
          if [ "$AGAIN" = true ]; then args+=(--again); fi
          sh launcher/tools/r3d/gpu_python.sh launcher/tools/bake/bake.py bake "${args[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: bakes-gpu
          path: ${{ runner.temp }}/bakes
          if-no-files-found: ignore
