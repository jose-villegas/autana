name: Nightly scoped performance

on:
  schedule:
    - cron: '30 20 * * *'
  workflow_dispatch:
    inputs:
      from:
        description: First candidate SHA (inclusive)
        required: false
      max_steps:
        description: Maximum new candidates per board
        required: false

concurrency: nightly-perf
permissions:
  contents: write

env:
  SCOPED_BOARDS: 20E8 2124
  SELFTEST_BOARD: '2124'
  GH_TOKEN: ${{ github.token }}
  GIT_CONFIG_COUNT: '4'
  GIT_CONFIG_KEY_0: core.hooksPath
  GIT_CONFIG_VALUE_0: /dev/null
  GIT_CONFIG_KEY_1: filter.lfs.process
  GIT_CONFIG_VALUE_1: ''
  GIT_CONFIG_KEY_2: filter.lfs.smudge
  GIT_CONFIG_VALUE_2: ''
  GIT_CONFIG_KEY_3: filter.lfs.required
  GIT_CONFIG_VALUE_3: 'false'

jobs:
  nightly:
    runs-on: [self-hosted, windows, board]
    # 22:30 queue through 07:00 plus result publication.
    timeout-minutes: 600
    defaults:
      run:
        shell: 'C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -eo pipefail {0}'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          lfs: false
          persist-credentials: false
          set-safe-directory: false

      - name: Prepare the data branch and shared plan
        env:
          FROM_SHA: ${{ inputs.from }}
          MAX_STEPS: ${{ inputs.max_steps }}
        run: |
          export PATH="$(cygpath -u "$GITHUB_WORKSPACE")/tools:$PATH"
          PY=$(. scripts/lib/python.sh && find_python)
          data="$RUNNER_TEMP/perf-data-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          out="$RUNNER_TEMP/nightly-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$data" "$out"
          echo "PERF_DATA=$(cygpath -w "$data")" >> "$GITHUB_ENV"
          echo "PERF_OUT=$(cygpath -w "$out")" >> "$GITHUB_ENV"
          git init "$data"
          git -C "$data" remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          if git -c "http.extraheader=$auth" -C "$data" ls-remote --exit-code origin refs/heads/perf-data; then
            git -c "http.extraheader=$auth" -C "$data" fetch origin perf-data
            git -C "$data" checkout -b perf-data FETCH_HEAD
          else
            status=$?
            [ "$status" -eq 2 ] || exit "$status"
            git -C "$data" checkout --orphan perf-data
          fi
          args=()
          [ -z "$FROM_SHA" ] || args+=(--from "$FROM_SHA")
          [ -z "$MAX_STEPS" ] || args+=(--max-steps "$MAX_STEPS")
          "$PY" launcher/tools/perf/nightly/scoped_chain.py plan --queue-at 22:30 \
            --boards $SCOPED_BOARDS --selftest-board "$SELFTEST_BOARD" --data "$data" --out "$out/plan.json" \
            --suite run_sand_perf_suite - - --suite run_sponza_perf_suite - - \
            --suite run_capybara_perf_suite - - "${args[@]}"

      - name: Run each board lane and wait for both
        run: |
          export PATH="$(cygpath -u "$GITHUB_WORKSPACE")/tools:$PATH"
          pids=()
          for board in $SCOPED_BOARDS; do
            bash launcher/tools/perf/nightly/lane.sh "$board" "$PERF_OUT/plan.json" "$PERF_DATA" "$PERF_OUT" &
            pids+=($!)
          done
          status=0
          for pid in "${pids[@]}"; do
            wait "$pid" || status=1
          done
          exit "$status"

      - name: Publish night manifests and LNT reports
        if: always() && env.PERF_DATA != ''
        run: |
          data=$(cygpath -u "$PERF_DATA")
          [ -d "$data/.git" ] || exit 0
          [ -d "$data/scoped" ] || exit 0
          git -C "$data" config user.name github-actions[bot]
          git -C "$data" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$data" add scoped
          if ! git -C "$data" diff --cached --quiet; then
            git -C "$data" commit -m 'perf: record nightly scoped chains'
            auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            git -c "http.extraheader=$auth" -C "$data" push origin HEAD:perf-data
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: nightly-raw-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .records/device
            ${{ env.PERF_OUT }}
          include-hidden-files: true
          if-no-files-found: ignore

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: nightly-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PERF_DATA }}/scoped
          if-no-files-found: ignore
