name: Nightly scoped performance

on:
  schedule:
    - cron: '17 20 * * *'
  workflow_dispatch:
    inputs:
      from:
        description: First candidate SHA (inclusive)
        required: false
      max_steps:
        description: Maximum new candidates per board
        required: false
      override:
        description: Start now instead of at the next BOARD_START
        type: boolean
        default: false

concurrency: nightly-perf
permissions:
  contents: read
  actions: read

env:
  NIGHT_START: ${{ vars.NIGHT_START }}
  NIGHT_ZONE: ${{ vars.NIGHT_ZONE }}
  GH_TOKEN: ${{ github.token }}

jobs:
  marker:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      OVERRIDE: ${{ inputs.override }}
      SCHEDULE: ${{ github.event.schedule }}
      BOARD_START: ${{ vars.BOARD_START }}
      NIGHT_ZONE: ${{ vars.NIGHT_ZONE }}
    outputs:
      marker: ${{ steps.marker.outputs.marker }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: false
          persist-credentials: false
          set-safe-directory: false
      - id: marker
        run: python3 scripts/lib/local_schedule.py --start BOARD_START marker

  wait:
    needs: marker
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      max-parallel: 1
      matrix:
        leg: [1, 2, 3, 4, 5]
    env:
      MARKER: ${{ needs.marker.outputs.marker }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: python3 scripts/lib/local_schedule.py wait --until "$MARKER"

  boards:
    needs: [marker, wait]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    env:
      MARKER: ${{ needs.marker.outputs.marker }}
      BOARD_HOSTS: ${{ vars.BOARD_HOSTS }}
      FROM_SHA: ${{ inputs.from }}
      MAX_STEPS: ${{ inputs.max_steps }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: false
          persist-credentials: false
          set-safe-directory: false
      - name: Start one board night per board host
        run: python3 scripts/ci/board_nights.py

  docs-eval:
    runs-on: [self-hosted, linux, gpu]
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: false
          persist-credentials: false

      - name: Set up docs retrieval model and server
        run: python3 scripts/docs/docs_llama.py setup

      - name: Evaluate hybrid docs retrieval
        run: python3 scripts/docs/docs_search.py --eval --expect hybrid

      - name: Stop docs model server
        if: always()
        run: python3 scripts/docs/docs_llama.py stop

  docs-eval-lexical:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: false
          persist-credentials: false

      - name: Evaluate lexical docs retrieval
        run: python3 scripts/docs/docs_search.py --eval --lexical --expect lexical

