name: Board CI

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  pull_request_target:
    types: [labeled]

concurrency:
  group: board-ci
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  board:
    # Only an explicit label on same-repository code permits PR execution on the runner; forks never qualify.
    if: github.event_name != 'pull_request_target' || (github.event.label.name == 'board-ci' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, windows, board]
    timeout-minutes: 150
    defaults:
      run:
        # An absolute Git for Windows path cannot resolve to WSL's bash.exe through PATH.
        shell: '"C:\Program Files\Git\bin\bash.exe" --noprofile --norc -eo pipefail {0}'
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        # Process-scoped overrides disable the global LFS hook and filters without writing machine Git config.
        env:
          GIT_CONFIG_COUNT: '4'
          GIT_CONFIG_KEY_0: core.hooksPath
          GIT_CONFIG_VALUE_0: /dev/null
          GIT_CONFIG_KEY_1: filter.lfs.process
          GIT_CONFIG_VALUE_1: ''
          GIT_CONFIG_KEY_2: filter.lfs.smudge
          GIT_CONFIG_VALUE_2: ''
          GIT_CONFIG_KEY_3: filter.lfs.required
          GIT_CONFIG_VALUE_3: 'false'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          lfs: false
          persist-credentials: false
          set-safe-directory: false

      - name: Warn about concurrent GPU work
        run: |
          for workflow in bakes-gpu.yml doc-images-gpu.yml; do
            if ! count=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?status=in_progress&per_page=1" --jq '.total_count'); then
              echo "::warning::Could not check $workflow activity"
            elif [ "$count" -gt 0 ]; then
              echo "::warning::$workflow is in progress; Board CI continues"
            fi
          done

      - name: Self-test and verify the running image under one board lock
        id: device
        run: |
          export PATH="$GITHUB_WORKSPACE/tools:$PATH"
          cat > "$RUNNER_TEMP/board-ci-steps.sh" <<'SH'
          set -eo pipefail
          status=0
          autana selftest || status=$?
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          autana buildid --json > .records/device/running-build.json
          python - <<'PY'
          import json
          from pathlib import Path
          expected = Path('launcher/build.diag/build_id.txt').read_text(encoding='ascii').strip()
          actual = json.loads(Path('.records/device/running-build.json').read_text())['build_id']
          if not expected or actual != expected:
              raise SystemExit(f'BUILD_ID mismatch: built {expected}, running {actual}')
          print(f'Verified BUILD_ID={actual}')
          PY
          # Lifecycle tour and portable suite steps go here, inside the same board hold.
          SH
          status=0
          autana --wait 1800 lock run -- 'C:/Program Files/Git/bin/bash.exe' "$RUNNER_TEMP/board-ci-steps.sh" || status=$?
          if [ "$status" -eq 75 ]; then
            echo '::notice::skipped: boards busy'
            echo 'skipped=true' >> "$GITHUB_OUTPUT"
            echo 'Board CI skipped: boards busy' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$status"

      - name: Summarize the device capture
        if: always() && steps.device.outcome != 'skipped' && steps.device.outputs.skipped != 'true'
        run: |
          python - <<'PY'
          import os
          import sys
          from pathlib import Path
          sys.path[:0] = ['scripts/device', 'scripts/lib']
          from device_report import read_capture_text, read_index
          from device_capture import results, SELFTEST_COMPLETE_RE
          from device_lock import board_label

          entries = [entry for entry in read_index('.records/device/index.jsonl')
                     if entry['command'] == 'selftest']
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              if not entries:
                  summary.write('Board CI: no self-test capture available; see the failed step.\n')
              else:
                  entry = entries[-1]
                  text = read_capture_text(entry['capture_path'])
                  suites = {}
                  for result in results(text):
                      suite = result['file'].replace('\\', '/').rsplit('/', 1)[-1].removesuffix('.c')
                      suites[suite] = suites.get(suite, True) and result['status'] == 'PASS'
                  passed = sum(suites.values())
                  failed = len(suites) - passed
                  summary.write(f"Board: {board_label(entry['board'])}\n\n")
                  summary.write(f"Build ID: `{entry['build_id']}`\n\n")
                  summary.write(f'Suites by Unity source file: {passed} passed, {failed} failed.\n\n')
                  if not SELFTEST_COMPLETE_RE.search(text):
                      summary.write('Partial capture: self-test did not complete.\n')
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: board-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: .records/device
          include-hidden-files: true
          if-no-files-found: ignore
