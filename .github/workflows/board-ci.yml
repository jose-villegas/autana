name: Board CI

on:
  workflow_dispatch:

concurrency:
  group: board-ci

permissions:
  contents: read
  actions: read

jobs:
  board:
    outputs:
      # Whether board-steps.sh ran both stages to the end, whatever its tests reported; unset while the
      # boards were busy. A failed build never reached the board.
      boards_ran: ${{ steps.device.outputs.boards_ran }}
      prepared: ${{ steps.prepare.outcome }}
    runs-on: [self-hosted, windows, board]
    timeout-minutes: 120
    defaults:
      run:
        # An absolute Git for Windows path cannot resolve to WSL's bash.exe through PATH. The runner
        # rejects a quoted executable in a custom shell, so the path is the space-free 8.3 form.
        shell: 'C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -eo pipefail {0}'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        # Process-scoped overrides disable the global LFS hook and filters without writing machine Git config.
        env:
          GIT_CONFIG_COUNT: '4'
          GIT_CONFIG_KEY_0: core.hooksPath
          GIT_CONFIG_VALUE_0: /dev/null
          GIT_CONFIG_KEY_1: filter.lfs.process
          GIT_CONFIG_VALUE_1: ''
          GIT_CONFIG_KEY_2: filter.lfs.smudge
          GIT_CONFIG_VALUE_2: ''
          GIT_CONFIG_KEY_3: filter.lfs.required
          GIT_CONFIG_VALUE_3: 'false'
        with:
          lfs: false
          persist-credentials: false
          set-safe-directory: false

      - name: Prepare the shell image and console tests
        id: prepare
        run: |
          export PATH="$(cygpath -u "$GITHUB_WORKSPACE")/tools:$PATH"
          bash scripts/ci/board-prepare.sh
          autana build diag

      - name: Self-test and console tests under one board lock
        id: device
        run: |
          rm -f "$RUNNER_TEMP/board-ci-selftest.log"
          export PATH="$(cygpath -u "$GITHUB_WORKSPACE")/tools:$PATH"
          steps_log="$RUNNER_TEMP/board-ci-steps.log"
          if autana --wait 1800 lock run -- "$(cygpath -w "$BASH")" scripts/ci/board-steps.sh | tee "$steps_log"; then
            status=0
          else
            status=$?
          fi
          if [ "$status" -eq 75 ]; then
            echo '::notice::skipped: boards busy'
            echo 'skipped=true' >> "$GITHUB_OUTPUT"
            echo 'Board CI skipped: boards busy' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          PY=$(. scripts/lib/python.sh && find_python)
          "$PY" scripts/ci/board_alarm.py ran --log "$steps_log" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Summarize the device capture
        if: always() && steps.device.outcome != 'skipped' && steps.device.outputs.skipped != 'true'
        run: |
          for log in selftest; do
            capture="$RUNNER_TEMP/board-ci-$log.log"
            if [ -f "$capture" ] && grep -q '^report: ' "$capture"; then
              sed -n 's/^report: //p' "$capture" | tr -d '\r' |
                while IFS= read -r report; do
                  cat "$report" >> "$GITHUB_STEP_SUMMARY"
                done
            else
              echo "Board CI: no $log capture available; see the failed step." >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: board-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: .records/device
          include-hidden-files: true
          if-no-files-found: ignore

  alarm:
    needs: board
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: board-ci-alarm
      cancel-in-progress: false
    permissions:
      issues: write
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: false
          persist-credentials: false

      # Failed tests leave this run red, not the boards down.
      - name: Raise the board-ci-down alarm
        if: needs.board.result == 'cancelled' || (needs.board.result == 'failure' && needs.board.outputs.prepared != 'failure' && needs.board.outputs.boards_ran != 'true')
        env:
          BOARD_RESULT: ${{ needs.board.result }}
        run: python3 scripts/ci/board_alarm.py raise --reason "board job $BOARD_RESULT; the board did not run every suite"

      - name: Clear the board-ci-down alarm
        if: (needs.board.result == 'success' || needs.board.result == 'failure') && needs.board.outputs.boards_ran == 'true'
        run: python3 scripts/ci/board_alarm.py clear
