name: Lifecycle Tour

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'launcher/main/**'
      - 'launcher/sdkconfig*'
      - 'launcher/CMakeLists.txt'
      - 'launcher/test/qemu_run.py'
      - 'launcher/test/qemu/**'
      - 'launcher/test/run_qemu_tests.sh'
      - 'scripts/lib/lifecycle_tour.py'
      - 'scripts/lib/device_capture.py'
      - '.github/actions/**'
      - '.github/workflows/lifecycle-tour.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  lifecycle-tour:
    name: App and scene lifecycles under QEMU
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/patched-qemu
        with:
          command: >-
            sh test/run_qemu_tests.sh --tour --timeout 2100
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lifecycle-tour-serial-log
          path: launcher/build.qemu.shell/qemu_serial.log
          if-no-files-found: ignore
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lifecycle-tour-image
          path: |
            launcher/build.qemu.shell/flasher_args.json
            launcher/build.qemu.shell/launcher.elf
            launcher/build.qemu.shell/*.bin
            launcher/build.qemu.shell/*/*.bin
            !launcher/build.qemu.shell/qemu_*.bin
          retention-days: 14
          if-no-files-found: ignore
