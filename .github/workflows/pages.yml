name: Pages

# Builds the GitHub Pages site: a front page from .github/pages/ in the stock
# Jekyll theme, the sand app's browser build under /sand/ and the C4
# architecture explorer under /architecture/. A Pages deploy replaces
# the whole site, so everything on it is built here, in one artifact.
#
# The browser build lives on feature/web-pages, but the site has to show
# main's source: the build merges the latest main into the branch first, in
# the runner only, and fails rather than publish if that merge conflicts.
# A push to the branch runs it, and main's pages-trigger.yml calls it on
# every push to main. Pull requests to main get web-check.yml instead, which
# builds without publishing.
#
# The explorer's generator lives in the private development repository,
# checked out as .dev the way a local checkout holds it. Needs the
# repository setting Pages > Source set to "GitHub Actions", and a secret
# AUTANA_DEV_TOKEN that can read jose-villegas/autana-dev.

on:
  push:
    branches: [feature/web-pages]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/web-pages
          fetch-depth: 0
      - name: Bring in main
        uses: ./.github/actions/merge-ref
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          repository: jose-villegas/autana-dev
          token: ${{ secrets.AUTANA_DEV_TOKEN }}
          path: .dev
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - name: Front page
        uses: actions/jekyll-build-pages@v1
        with:
          source: .github/pages
          destination: _front
      - name: Sand, in the browser
        run: |
          mkdir -p _site
          cp -r _front/. _site/
          sh launcher/main/apps/sand/tools/web/build_web.sh _site/sand
      - name: Test the explorer's generator
        run: python3 .dev/launcher/tools/architecture/test_build.py
      - name: Architecture explorer
        run: python3 .dev/launcher/tools/architecture/build.py -o _site/architecture
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Publish to Pages
    concurrency:
      group: pages
      cancel-in-progress: false
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
