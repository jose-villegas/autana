name: Pages

# The Pages site is built by feature/web-pages's own workflow, which merges
# the latest main before it builds. GitHub runs a branch's workflows only for
# pushes to that branch, so a push to main calls it here, at that branch;
# without this the site would keep showing an older main. A daily run calls
# it too, so what the site builds from beside main is at most a day old.
#
# A pull request calls that branch's web-check.yml instead, which builds
# without publishing. Not a required check.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 06:00 Berlin in winter (07:00 in summer), hours after the nightly.
    - cron: '0 5 * * *'

permissions:
  contents: read

jobs:
  pages:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: jose-villegas/autana/.github/workflows/pages.yml@feature/web-pages
    secrets: inherit

  web-build:
    name: Web build
    if: github.event_name == 'pull_request'
    concurrency:
      group: web-build-${{ github.ref }}
      cancel-in-progress: true
    uses: jose-villegas/autana/.github/workflows/web-check.yml@feature/web-pages
    with:
      ref: ${{ github.sha }}
