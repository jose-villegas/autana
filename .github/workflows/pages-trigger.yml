name: Pages

# The Pages site is built by feature/web-pages's own workflow, which merges
# the latest main before it builds. GitHub runs a branch's workflows only for
# pushes to that branch, so a push to main calls it here, at that branch;
# without this the site would keep showing an older main. A daily run calls
# it too, so what the site builds from beside main is at most a day old.
#
# A pull request calls that branch's web-check.yml instead, which builds
# without publishing. Not a required check.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 07:30 Berlin in winter (08:30 in summer): after the nightly, and after the
    # daily 07:00 run that refreshes what the site reads beside main.
    - cron: '30 6 * * *'

permissions:
  contents: read

jobs:
  pages:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: jose-villegas/autana/.github/workflows/pages.yml@feature/web-pages
    secrets: inherit

  web-build:
    name: Web build
    if: github.event_name == 'pull_request'
    concurrency:
      group: web-build-${{ github.ref }}
      cancel-in-progress: true
    uses: jose-villegas/autana/.github/workflows/web-check.yml@feature/web-pages
    with:
      ref: ${{ github.sha }}

  # A failed main build of the site raises the pages-down alarm; a built one clears it. Board health also raises
  # it when the site has not deployed for a while.
  alarm:
    needs: pages
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: pages-alarm
      cancel-in-progress: false
    permissions:
      issues: write
      actions: read
      checks: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: false
          persist-credentials: false

      - name: Raise the pages-down alarm
        if: needs.pages.result == 'failure'
        run: python3 scripts/ci/board_alarm.py raise --kind pages --errors --reason "Pages build failed on main"

      - name: Clear the pages-down alarm
        if: needs.pages.result == 'success'
        run: python3 scripts/ci/board_alarm.py clear --kind pages
