name: Host Tests

# Everything that compiles and runs on the runner itself, no ESP-IDF: the
# portable suite (launcher/test/run_tests.sh, plain gcc), the sand
# fingerprint, the render scenes, and the host editor's CTest suite. The
# editor steps run even when an earlier one failed, so one red suite never
# hides the state of the other.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# A build fetches the bakes launcher/bakes.lock names (bake/bake.py): from the
# release, or before main publishes them from the run that made them, which
# needs this token.
env:
  GH_TOKEN: ${{ github.token }}

jobs:
  host-tests:
    name: Host and editor tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The packs' meshes come from the bake cache; fetching first names a missing bake on its own.
      - name: Fetch the bakes launcher/bakes.lock names
        run: time python3 launcher/tools/bake/bake.py fetch
      - run: bash launcher/test/run_tests.sh
      - run: bash launcher/test/run_tests.sh --sanitize
      - name: Upload host test log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: host-test-log
          path: launcher/test/build/run_tests.log
          if-no-files-found: warn
      - run: bash launcher/main/apps/sand/tools/report_reactions.sh --check
      - run: sh launcher/main/apps/sand/tools/report_fingerprint.sh --check
      - run: sh launcher/tools/render/render_all_scenes.sh

      # EDITOR_BUILD_GUI=OFF leaves out only the SDL2 + Dear ImGui window,
      # which nothing here can exercise, so the runner needs no display
      # packages.
      - name: Configure the editor
        id: editor-configure
        if: ${{ !cancelled() }}
        run: cmake -S editor -B editor/build -DCMAKE_BUILD_TYPE=Debug -DEDITOR_BUILD_GUI=OFF
      - name: Build the editor
        id: editor-build
        if: ${{ !cancelled() && steps.editor-configure.outcome == 'success' }}
        run: cmake --build editor/build --parallel
      - name: Editor tests
        if: ${{ !cancelled() && steps.editor-build.outcome == 'success' }}
        run: ctest --test-dir editor/build --output-on-failure
