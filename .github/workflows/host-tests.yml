name: Host Tests

# Everything that compiles and runs on the runner itself, no ESP-IDF: the
# portable suite (launcher/test/run_tests.sh, plain gcc), the sand
# fingerprint and the render scenes.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# A build fetches the bakes launcher/bakes.lock names (bake/bake.py): from the
# release, or before main publishes them from the run that made them, which
# needs this token.
env:
  GH_TOKEN: ${{ github.token }}

jobs:
  inputs:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      host-tests: ${{ steps.affected.outputs.host-tests }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: affected
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/job_inputs.py affected --job host-tests

  host-tests:
    needs: inputs
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.inputs.result != 'success' || needs.inputs.outputs.host-tests == 'true') }}
    name: Host and editor tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/job-inputs
        with: {step: arm}

      - uses: ./.github/actions/host-tools
      # The packs' meshes come from the bake cache; fetching first names a missing bake on its own.
      - name: Fetch the bakes launcher/bakes.lock names
        run: time python3 launcher/tools/bake/bake.py fetch
      - run: bash launcher/test/run_tests.sh
      - run: bash launcher/test/run_tests.sh --sanitize
        env:
          PUSH_TEST_GATE: "true"
      - name: Upload host test log
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: host-test-log
          path: launcher/test/build/run_tests.log
          if-no-files-found: warn
      - run: bash launcher/main/apps/sand/tools/report_reactions.sh --check
      - run: sh launcher/main/apps/sand/tools/report_fingerprint.sh --check
      - run: sh launcher/tools/render/render_all_scenes.sh

      - name: Standalone package tests
        if: ${{ !cancelled() }}
        run: |
          for package in launcher/packages/*/; do
            [ -d "${package}tests" ] || continue
            name=$(basename "$package")
            cmake -S "$package" -B "build/packages/$name" -DCMAKE_C_COMPILER=gcc
            cmake --build "build/packages/$name" --parallel
            ctest --test-dir "build/packages/$name" --output-on-failure --no-tests=error
          done

      - name: Standalone render host
        if: ${{ !cancelled() }}
        run: |
          cmake -S launcher/tools/render -B build/render-host -DCMAKE_C_COMPILER=gcc
          cmake --build build/render-host --parallel

      - name: Exhaustive reciprocal-root proof
        if: ${{ !cancelled() }}
        run: |
          mkdir -p build
          cc -O3 -Ilauncher/packages/math/include launcher/test/math_rsqrt_check.c -lm -o build/math_rsqrt_check
          time build/math_rsqrt_check

      - uses: ./.github/actions/job-inputs
        if: ${{ !cancelled() }}
        with: {step: record}
