name: Format

# The formatting gate: every first-party C and header file checked against
# .clang-format, and every tracked text file against CRLF, on each pull
# request and each push to main. The pre-commit hook
# (scripts/install-git-hooks.sh) reports formatting earlier, but cannot
# enforce it - it is opt-in, skippable with --no-verify, and absent from any
# commit CI or a merge makes.
#
# clang-format is pinned to one exact version, not a minimum: see
# docs/C-Style-Guide.md's "One formatter version" for why the versions
# disagree on real files in this tree. pip rather than apt because it
# carries the exact patch version on any runner image; 19 because it is
# also what ESP-IDF's esp-clang bundles, so contributors usually already
# have it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  format:
    name: clang-format and LF line endings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same version scripts/gates/check-format.sh pins. Keep the two in step:
      # PINNED_MAJOR there, this line here.
      - name: Install clang-format 19
        run: pip install 'clang-format==19.1.7'

      - name: Which clang-format, and which files
        run: |
          set -eu
          scripts/gates/check-format.sh --which
          clang-format --version
          echo "Files checked: $(scripts/gates/format-file-list.sh | wc -l)"

      # scripts/gates/format-file-list.sh is the same list the hook filters against,
      # so a file cannot be gated here and skipped there. Vendored and
      # generated sources are excluded by it, not by this workflow.
      - name: Every first-party C and header file is formatted
        run: scripts/gates/format-file-list.sh | xargs scripts/gates/check-format.sh --check

      # Reads the index, not the checkout, so a CRLF file fails here whatever
      # .gitattributes or the runner's git config would do to it on disk.
      - name: No text file is stored with CRLF
        if: ${{ !cancelled() }}
        run: |
          set -eu
          crlf=$(git ls-files --eol | awk '$1 ~ /crlf|mixed/ {print $NF}')
          if [ -n "$crlf" ]; then
            echo "Stored with CRLF - run: git add --renormalize ."
            echo "$crlf"
            exit 1
          fi
