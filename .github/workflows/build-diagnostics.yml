name: Build (Development)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# A build fetches the bakes launcher/bakes.lock names (bake/bake.py): from the
# release, or before main publishes them from the run that made them, which
# needs this token.
env:
  GH_TOKEN: ${{ github.token }}

jobs:
  inputs:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      build-development: ${{ steps.affected.outputs.build-development }}
      build-diagnostics: ${{ steps.affected.outputs.build-diagnostics }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: affected
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/job_inputs.py affected --job build-development --job build-diagnostics

  build-development:
    needs: inputs
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.inputs.result != 'success' || needs.inputs.outputs.build-development == 'true') }}
    name: Build (development)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/job-inputs
        with: {step: arm}

      - uses: ./.github/actions/idf-build
        with:
          cache-name: dev
          command: >-
            ../tools/autana build dev --project ..
            && cd ..
            && python3 launcher/tools/build/memory_map.py --check --require-pin launcher/build.dev

      - uses: ./.github/actions/job-inputs
        if: ${{ !cancelled() }}
        with: {step: record}

  # An instrument rather than a gate (see sdkconfig.defaults.diag_perf), so
  # a pull request does not wait on it: main and a manual run build it, with
  # and without the frame laps nothing else compiles.
  build-perf-scope:
    name: Build (diagnostics perf scope)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/idf-build
        with:
          cache-name: diag-perf
          command: >-
            ../tools/autana build diag --perf-scope --project ..
            && ../tools/autana build diag --perf-scope --frame-laps --project ..

  build-diagnostics:
    needs: inputs
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.inputs.result != 'success' || needs.inputs.outputs.build-diagnostics == 'true') }}
    name: Build (diagnostics and complexity gate)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true

      - uses: ./.github/actions/job-inputs
        with: {step: arm}

      - uses: ./.github/actions/idf-build
        with:
          cache-name: diag
          command: >-
            ../tools/autana build diag --project ..
            && idf.py -C packages/math/test_apps -D IDF_TARGET=esp32s3 build
            && python "$IDF_PATH/tools/idf_tools.py" install esp-clang
            && cd ..
            && launcher/tools/build/build_diag_check.sh --gates-only --ci

      - uses: ./.github/actions/job-inputs
        if: ${{ !cancelled() }}
        with: {step: record}
