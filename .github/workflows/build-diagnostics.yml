name: Build (Development)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-development:
    name: Build (development)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/idf-build
        with:
          cache-name: dev
          command: ../tools/autana build dev --project ..

  # An instrument rather than a gate (see sdkconfig.defaults.diag_perf), so
  # a pull request does not wait on it: main and a manual run build it.
  build-perf-scope:
    name: Build (diagnostics perf scope)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/idf-build
        with:
          cache-name: diag-perf
          command: ../tools/autana build diag --perf-scope --project ..

  build-diagnostics:
    name: Build (diagnostics and complexity gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: ./.github/actions/idf-build
        with:
          cache-name: diag
          command: >-
            ../tools/autana build diag --project ..
            && python "$IDF_PATH/tools/idf_tools.py" install esp-clang
            && cd ..
            && python3 launcher/tools/quality/complexity_gate.py
            && python "$IDF_PATH/tools/idf_size.py" --files --format csv launcher/build.diag/launcher.map | python3 launcher/tools/quality/suite_static_data_gate.py
            && python3 launcher/tools/quality/stack_chain_gate.py
            && python3 launcher/tools/quality/misra_tidy_gate.py
            && python3 launcher/tools/build/check_no_soft_double.py launcher/build.diag
