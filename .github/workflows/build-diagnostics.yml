name: Build (Development)

on:
  push:
  pull_request:

jobs:
  build-variants:
    name: Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: development
            args: --dev
          - name: diagnostics perf scope
            args: --diag --perf-scope
    steps:
      - uses: actions/checkout@v4

      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: release-v5.5
          target: esp32s3
          path: launcher
          command: bash tools/build_flash.sh ${{ matrix.args }} --build-only

  build-diagnostics:
    name: Build (diagnostics and complexity gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: release-v5.5
          target: esp32s3
          path: launcher
          command: >-
            bash tools/build_flash.sh --diag --build-only
            && python "$IDF_PATH/tools/idf_tools.py" install esp-clang
            && cd ..
            && python3 launcher/tools/complexity_gate.py
