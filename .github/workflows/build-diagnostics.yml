name: Build (Development)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-development:
    name: Build (development)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/idf-build
        with:
          cache-name: dev
          command: bash tools/build/build_flash.sh --dev --build-only

  # An instrument rather than a gate (see sdkconfig.defaults.diag_perf), so
  # a pull request does not wait on it: main and a manual run build it.
  build-perf-scope:
    name: Build (diagnostics perf scope)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/idf-build
        with:
          cache-name: diag-perf
          command: bash tools/build/build_flash.sh --diag --perf-scope --build-only

  build-diagnostics:
    name: Build (diagnostics and complexity gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: ./.github/actions/idf-build
        with:
          cache-name: diag
          command: >-
            bash tools/build/build_flash.sh --diag --build-only
            && python "$IDF_PATH/tools/idf_tools.py" install esp-clang
            && cd ..
            && python3 launcher/tools/quality/complexity_gate.py
