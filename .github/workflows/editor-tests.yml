name: Editor Tests

# The host editor's own suite (editor/, CTest): the layout document, edit
# history, the layout generator, system navigation, and the firmware UI
# rendered through the host runtime. EDITOR_BUILD_GUI=OFF leaves out only
# the SDL2 + Dear ImGui window, which nothing here can exercise, so the runner
# needs no display packages. Own workflow file for its own badge - see
# host-tests.yml's top comment.

on:
  push:
  pull_request:

jobs:
  editor-tests:
    name: Editor tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S editor -B editor/build -DCMAKE_BUILD_TYPE=Debug -DEDITOR_BUILD_GUI=OFF
      - name: Build
        run: cmake --build editor/build --parallel
      - name: Test
        run: ctest --test-dir editor/build --output-on-failure
