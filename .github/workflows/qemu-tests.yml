name: QEMU Tests

# Every suite in the real Xtensa image, under Espressif's QEMU: the proof the
# host runner cannot give, that the chip's build behaves as the laptop's does.
# docs/testing/QEMU.md says what a run is evidence of. It runs on main, by
# hand, and on pull requests that change a recorded job input. Other pull
# requests skip the job and report success; a failed inputs gate runs it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# A build fetches the bakes launcher/bakes.lock names (bake/bake.py): from the
# release, or before main publishes them from the run that made them, which
# needs this token.
env:
  GH_TOKEN: ${{ github.token }}

jobs:
  inputs:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      qemu-tests: ${{ steps.affected.outputs.qemu-tests }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: affected
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/job_inputs.py affected --job qemu-tests

  qemu-tests:
    needs: inputs
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.inputs.result != 'success' || needs.inputs.outputs.qemu-tests == 'true') }}
    name: Every suite under QEMU
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/job-inputs
        with: {step: arm}

      # No --icount: it puts both emulated cores on one host thread, doubling
      # the run, and a QEMU image reports every measured time rather than
      # enforcing it, so instruction counting buys a pass/fail run nothing.
      # The full scope takes about fourteen minutes on an idle desktop.
      - uses: ./.github/actions/patched-qemu
        with:
          command: >-
            sh test/run_qemu_tests.sh --timeout 4500

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qemu-serial-log
          path: launcher/build.qemu/qemu_serial.log
          if-no-files-found: ignore

      # The image that ran and its ELF: a panic in the log decodes only
      # against this build's ELF (a local build of the same commit links
      # differently), and qemu_run.py reruns the image as downloaded.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qemu-image
          path: |
            launcher/build.qemu/flasher_args.json
            launcher/build.qemu/launcher.elf
            launcher/build.qemu/*.bin
            launcher/build.qemu/*/*.bin
            !launcher/build.qemu/qemu_*.bin
          retention-days: 14
          if-no-files-found: ignore

      - uses: ./.github/actions/job-inputs
        if: ${{ !cancelled() }}
        with: {step: record}
