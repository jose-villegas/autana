name: README Images

# The pictures under docs/images/overview/ are host renders of the firmware.
# This regenerates them on main and, only when some image's decoded pixels
# changed, keeps ONE pull request "docs: refresh README images" up to date on
# a fixed branch. Nothing changed: nothing is committed, and a refresh PR that
# no longer has a diff is closed.
#
# Pixels are compared, never bytes: launcher/tools/render/compare_images.py.
# A pull request opened with GITHUB_TOKEN starts no other workflows, so its
# checks do not run until someone reopens it or pushes to its branch.

on:
  push:
    branches: [main]
    paths:
      - 'launcher/**'
      - 'docs/images/**'
      - '.github/workflows/readme-images.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  REFRESH_BRANCH: feature/refresh-readme-images

jobs:
  refresh:
    name: Regenerate and compare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Pillow and ffmpeg
        run: |
          pip install pillow==12.3.0
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      # Exit 1 means some image changed or is an orphan; 2 means it could not
      # be rendered, which fails the job.
      - name: Render and compare
        id: render
        run: |
          set +e
          bash launcher/tools/render/render_readme_images.sh --check | tee "$RUNNER_TEMP/report.txt"
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -gt 1 ] || grep -q '^orphan ' "$RUNNER_TEMP/report.txt"; then
            echo "The images could not be checked (exit $code)." >&2
            exit 1
          fi
          grep '^changed ' "$RUNNER_TEMP/report.txt" > "$RUNNER_TEMP/changed.txt" || true
          echo "count=$(wc -l < "$RUNNER_TEMP/changed.txt")" >> "$GITHUB_OUTPUT"

      - name: Nothing changed, close a stale refresh PR
        if: steps.render.outputs.count == '0' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh pr list --head "$REFRESH_BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh pr close "$number" --delete-branch \
              --comment "Every README image already matches what main renders; nothing left to refresh."
          fi

      - name: Commit the changed images and open or update the PR
        if: steps.render.outputs.count != '0' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out=launcher/tools/results/readme_images/out
          git switch -C "$REFRESH_BRANCH"
          while IFS= read -r line; do
            name=${line#changed }
            name=${name%%:*}
            cp "$out/$name" "docs/images/overview/$name"
          done < "$RUNNER_TEMP/changed.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/images/overview
          git commit -m 'docs: refresh README images'
          git push --force origin "$REFRESH_BRANCH"

          {
            echo "The README images no longer match what \`main\` renders. Regenerated by \`launcher/tools/render/render_readme_images.sh\` on ${GITHUB_SHA::7}."
            echo
            echo "Checks do not start on a PR opened by the workflow: close and reopen it to run CI."
            echo
            echo "| Image | Change |"
            echo "|---|---|"
            sed -e 's/^changed \([^:]*\): \(.*\)$/| `\1` | \2 |/' "$RUNNER_TEMP/changed.txt"
          } > "$RUNNER_TEMP/body.md"

          number=$(gh pr list --head "$REFRESH_BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh pr edit "$number" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base main --head "$REFRESH_BRANCH" \
              --title 'docs: refresh README images' --body-file "$RUNNER_TEMP/body.md"
          fi
