name: Branch Name

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  branch-name:
    name: Branch name
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check PR branch name
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: scripts/gates/check-branch-name.sh "$HEAD_REF"

  pr-ticket:
    name: PR ticket
    # Workflow-opened PRs (generated doc refreshes) have no backlog ticket.
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check PR description names its ticket
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n' "$PR_BODY" | scripts/gates/check-pr-ticket.sh
