name: Claim probe

# Temporary: proves runner_vendor.py's mark, claim and dedupe on hosted runners without tracing.

on:
  pull_request:
    paths: [.github/workflows/claim-probe.yml]

permissions:
  contents: read

jobs:
  probe:
    name: Trace reference shard ${{ matrix.shard }} (candidate ${{ matrix.candidate }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
        candidate: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: This runner's CPU vendor
        id: vendor
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/runner_vendor.py mark "${{ matrix.shard }}" "${{ matrix.candidate }}" "$RUNNER_TEMP/vendor"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.vendor.outputs.marker != ''
        with:
          name: ${{ steps.vendor.outputs.marker }}
          path: ${{ runner.temp }}/vendor
          retention-days: 1
      - name: Whether this candidate traces the shard
        id: claim
        if: steps.vendor.outputs.marker != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VENDOR_MARKER: ${{ steps.vendor.outputs.marker }}
        run: python3 scripts/ci/runner_vendor.py claim "${{ matrix.shard }}" "${{ matrix.candidate }}"
      - name: Stand-in trace
        if: steps.claim.outputs.trace == 'true'
        run: mkdir -p "$RUNNER_TEMP/shard" && echo "${{ matrix.shard }}" > "$RUNNER_TEMP/shard/part-${{ matrix.shard }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.claim.outputs.trace == 'true'
        with:
          name: ${{ steps.vendor.outputs.shard_artifact }}
          path: ${{ runner.temp }}/shard
          retention-days: 1

  join:
    needs: probe
    if: ${{ !cancelled() && needs.probe.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: reference-shard-*
          path: ${{ runner.temp }}/shards
      - name: One artifact per shard
        run: |
          ls "$RUNNER_TEMP/shards"
          python3 scripts/ci/runner_vendor.py dedupe "$RUNNER_TEMP/shards"
          test "$(ls "$RUNNER_TEMP/shards" | wc -l)" = 2
