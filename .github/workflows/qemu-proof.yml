name: QEMU proof t8jy

# Throwaway: never merged. CI's own image of 34c77534 (run 38063449116),
# autorun 8 times per QEMU, prebuilt vs patched.

on:
  push:
    branches: [bugfix/t8jy-qemu-proof]

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  run:
    name: ${{ matrix.qemu }} ${{ matrix.n }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        qemu: [prebuilt, patched]
        n: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: qemu-image
          run-id: 38063449116
          github-token: ${{ github.token }}
          path: launcher/ci-image
      - if: matrix.qemu == 'patched'
        uses: actions/cache/restore@v4
        with:
          path: launcher/build.qemu-xtensa
          key: qemu-xtensa-
          restore-keys: qemu-xtensa-
      - if: matrix.qemu == 'patched'
        uses: ./.github/actions/idf-build
        with:
          cache-name: qemu-proof
          command: >-
            (python3 test/qemu/patched_qemu.py path
            || (apt-get update -qq
            && python3 test/qemu/patched_qemu.py deps | xargs apt-get install -y -qq
            && python3 test/qemu/patched_qemu.py build))
            && python3 test/qemu_run.py ci-image --timeout 3000 --workdir ci-run
      - if: matrix.qemu == 'prebuilt'
        uses: ./.github/actions/idf-build
        with:
          cache-name: qemu-proof
          command: python3 test/qemu_run.py ci-image --timeout 3000 --workdir ci-run
      - if: ${{ !cancelled() }}
        run: |
          f=launcher/ci-run/qemu_serial.log
          echo "${{ matrix.qemu }} ${{ matrix.n }}: panics=$(grep -a -c 'Guru Meditation\|uru Meditation' $f) $(grep -a -o 'EXCVADDR: 0x[0-9a-f]*' $f | tr '\n' ' ') $(grep -a -o 'SELFTEST_COMPLETE.*' $f | tail -1)" | tee -a $GITHUB_STEP_SUMMARY
          grep -a -m1 'qemu_run: ' launcher/ci-run/*.txt 2>/dev/null || true
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ matrix.qemu }}-${{ matrix.n }}
          path: launcher/ci-run/qemu_serial.log
