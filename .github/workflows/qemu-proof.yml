name: QEMU proof t8jy

# Throwaway: never merged. An uncached patched_qemu.py build, then one
# suite under it, to prove the staged install is relocatable.

on:
  push:
    branches: [bugfix/t8jy-qemu-proof]

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: qemu-image
          run-id: 38063449116
          github-token: ${{ github.token }}
          path: launcher/ci-image
      - uses: ./.github/actions/idf-build
        with:
          cache-name: qemu-proof
          command: >-
            apt-get update -qq
            && python3 test/qemu/patched_qemu.py deps | xargs apt-get install -y -qq
            && python3 test/qemu/patched_qemu.py build
            && ls build.qemu-xtensa
            && python3 test/qemu_run.py ci-image --timeout 3000 --workdir ci-run
