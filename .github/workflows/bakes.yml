name: Bakes

# The expensive bakes (launcher/tools/bake/bake.py). On a pull request the CPU
# job bakes every mesh launcher/bakes.lock has no row for and uploads the
# files; the lock job then fails until the author runs
# `bake.py lock --from-run N` with that run and commits the lock. A fit needs
# the CUDA GPU, so the Bakes GPU workflow (bakes-gpu.yml) makes it, started by
# hand on the branch; no pull request reaches that runner. On main, publish uploads each locked file the `bakes` release lacks,
# taking it from the run that made it. No branch writes the release.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: bakes-${{ github.ref }}
  cancel-in-progress: false

# Read-only by default: the bake and lock jobs run the pull request's own code.
permissions:
  contents: read

jobs:
  cpu:
    name: Bake missing exports and meshes
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: List the exports and meshes the lock has no row for
        id: missing
        run: |
          python launcher/tools/bake/bake.py list --missing --kind blend | tee "$RUNNER_TEMP/blend.txt"
          python launcher/tools/bake/bake.py list --missing --kind mesh | tee "$RUNNER_TEMP/mesh.txt"
          echo "blend=$(wc -l < "$RUNNER_TEMP/blend.txt")" >> "$GITHUB_OUTPUT"
          echo "count=$(cat "$RUNNER_TEMP/blend.txt" "$RUNNER_TEMP/mesh.txt" | wc -l)" >> "$GITHUB_OUTPUT"

      # The exporter names the Blender it needs; the job installs that one.
      - name: Install Blender
        if: steps.missing.outputs.blend != '0'
        run: |
          version=$(sed -n 's/^BLENDER_VERSION = (\(.*\))$/\1/p' launcher/tools/gltf/blend_skin_to_glb.py | tr -d ' ' | tr , .)
          series=${version%.*}
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libxkbcommon0 libsm6
          curl -fsSL "https://download.blender.org/release/Blender$series/blender-$version-linux-x64.tar.xz" | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/blender-$version-linux-x64" >> "$GITHUB_PATH"

      - name: Fetch mesh source files
        if: steps.missing.outputs.count != '0'
        run: git lfs pull --exclude=""

      - name: Initialize only meshoptimizer
        if: steps.missing.outputs.count != '0'
        run: git submodule update --init --depth 1 third_party/upstream/meshoptimizer

      # The bakes trace rays on Mitsuba's LLVM variant, which needs libLLVM.
      - name: Install the r3d requirements and LLVM
        if: steps.missing.outputs.count != '0'
        run: |
          pip install -r launcher/tools/r3d/requirements.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends llvm

      - name: Bake
        if: steps.missing.outputs.count != '0'
        run: |
          python launcher/tools/bake/bake.py bake --kind blend --out "$RUNNER_TEMP/bakes"
          python launcher/tools/bake/bake.py bake --kind mesh --out "$RUNNER_TEMP/bakes"

      - uses: actions/upload-artifact@v4
        if: steps.missing.outputs.count != '0'
        with:
          name: bakes-cpu
          path: ${{ runner.temp }}/bakes

  lock:
    name: Lock is current
    if: github.event_name == 'pull_request'
    needs: cpu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Every needed key has a row and every row is needed
        run: python launcher/tools/bake/bake.py check

  publish:
    name: Publish locked bakes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Upload each locked file the release lacks
        env:
          GH_TOKEN: ${{ github.token }}
        run: python launcher/tools/bake/bake.py publish
