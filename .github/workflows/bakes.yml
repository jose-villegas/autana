name: Bakes

# The expensive bakes (launcher/tools/bake/bake.py), run for every push to a branch of this repository and by hand.
# On a branch, the CPU job bakes every mesh, fit's levels and sound launcher/bakes.lock has no row for, and the
# reference job traces and packs every missing reference set in one job; both upload the files; the lock job then
# fails until the author runs `bake.py lock --from-run N` with that run and commits the lock. A run that makes levels
# runs the sky-through-walls flythrough on them in the CPU job, so a fit that opens holes fails before it is locked. A mesh's and a reference set's bytes differ between CPU models, so every job that makes a bake
# runs on the one self-hosted runner that makes the fits, gpu-legion (docs/assets/Bakes.md). One runner, so these jobs
# and the fits queue behind each other. No pull request starts this workflow: a self-hosted runner never takes a pull
# request's code (scripts/gates/check_workflows.py), and only a branch of this repository is pushed here. The checks
# a pull request needs are this push run's, on its head commit; a fork's pull request gets them only once its branch
# is pushed here, and bakes-fork.yml fails it when it changes a bake. Each runner job installs into a venv of its own
# over the fit environment ~/gpu/env, so what it installs stays there (only a Bakes GPU dispatch installs into the
# fit environment), and its tracing steps run on every CPU at the idle priority scripts/lib/local_schedule.py gives
# a stage beside board work.
# A fit needs the CUDA GPU, so the Bakes GPU workflow (bakes-gpu.yml) makes it from the locked start and reference
# set, started by hand on the branch. On main, publish uploads each locked file the `bakes` release lacks, taking it
# from the run that made it. No branch writes the release.
# Each bake is uploaded whatever fails after it; a rerun's attempt uploads under
# its own name and first takes what its run's earlier attempts made.

on:
  push:
    branches: ['**']
  workflow_dispatch:

# One run per branch, push and dispatch alike: a push cancels the run of the head before it, queued or running, whose
# bakes the new head makes again if it still needs them (bake.py lock --from-run takes only a finished run). Main's
# runs are never cancelled and all queue; GitHub refuses `queue: max` with cancel-in-progress, so a branch keeps the
# single pending slot.
concurrency:
  group: bakes-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
  queue: ${{ github.ref == 'refs/heads/main' && 'max' || 'single' }}

# Read-only by default: the bake and lock jobs run the pushed branch's own code.
permissions:
  contents: read

jobs:
  inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      cpu: ${{ steps.affected.outputs.cpu }}
      lock: ${{ steps.affected.outputs.lock }}
      sky-through-walls: ${{ steps.affected.outputs.sky-through-walls }}
    steps:
      # The whole history, without file contents: a branch's changes are its diff from its merge base with main.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          filter: blob:none
      # Main and a dispatch bake everything; an empty output runs the job.
      - id: affected
        if: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/job_inputs.py affected --job cpu --job lock --job sky-through-walls


  cpu:
    needs: inputs
    if: ${{ !cancelled() && (needs.inputs.result != 'success' || needs.inputs.outputs.cpu != 'false') }}
    name: Bake missing exports and meshes
    runs-on: [self-hosted, linux, gpu-legion]
    timeout-minutes: 1440
    # actions: read lets a rerun take what its earlier attempts uploaded.
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/job-inputs
        with: {step: arm}

      # A venv of the job's own over the runner's fit environment (docs/assets/Bakes.md), first on PATH for every
      # later step: what the branch installs goes there, never into the fit environment.
      - name: Use a venv over the runner's environment
        run: |
          "$HOME/gpu/env/bin/python" -m venv --system-site-packages "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          echo "GPU_WORKFLOW=bakes.yml" >> "$GITHUB_ENV"

      - name: List the CPU bakes the lock has no row for
        id: missing
        shell: bash
        run: |
          python launcher/tools/bake/bake.py list --missing --kind blend | tee "$RUNNER_TEMP/blend.txt"
          python launcher/tools/bake/bake.py list --missing --kind mesh | tee "$RUNNER_TEMP/mesh.txt"
          python launcher/tools/bake/bake.py list --missing --kind sound | tee "$RUNNER_TEMP/sound.txt"
          python launcher/tools/bake/bake.py list --missing --kind levels | tee "$RUNNER_TEMP/levels.txt"
          python launcher/tools/bake/bake.py list --missing --kind texture | tee -a "$RUNNER_TEMP/levels.txt"
          python launcher/tools/bake/bake.py list --missing --kind sh_probes | tee "$RUNNER_TEMP/sh_probes.txt"
          echo "mesh=$(cat "$RUNNER_TEMP/mesh.txt" "$RUNNER_TEMP/levels.txt" "$RUNNER_TEMP/sh_probes.txt" | wc -l)" >> "$GITHUB_OUTPUT"
          echo "sound=$(wc -l < "$RUNNER_TEMP/sound.txt")" >> "$GITHUB_OUTPUT"
          echo "blend=$(wc -l < "$RUNNER_TEMP/blend.txt")" >> "$GITHUB_OUTPUT"
          # The levels this run makes (their fit is locked, so they have a key) and those still waiting for a fit.
          echo "levels=$(awk -F'\t' '$2 == "levels" && $3 ~ /^[0-9a-f]+$/' "$RUNNER_TEMP/levels.txt" | wc -l)" >> "$GITHUB_OUTPUT"
          echo "waiting=$(awk -F'\t' '$2 == "levels" && $3 !~ /^[0-9a-f]+$/' "$RUNNER_TEMP/levels.txt" | wc -l)" >> "$GITHUB_OUTPUT"
          echo "count=$(cat "$RUNNER_TEMP/blend.txt" "$RUNNER_TEMP/mesh.txt" "$RUNNER_TEMP/levels.txt" "$RUNNER_TEMP/sound.txt" "$RUNNER_TEMP/sh_probes.txt" | wc -l)" >> "$GITHUB_OUTPUT"

      # The exporter names the Blender it needs; the job installs that one, on the libraries the runner holds.
      - name: Install Blender
        if: steps.missing.outputs.blend != '0'
        run: |
          version=$(sed -n 's/^BLENDER_VERSION = (\(.*\))$/\1/p' launcher/tools/gltf/blend_skin_to_glb.py | tr -d ' ' | tr , .)
          series=${version%.*}
          curl -fsSL "https://download.blender.org/release/Blender$series/blender-$version-linux-x64.tar.xz" | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/blender-$version-linux-x64" >> "$GITHUB_PATH"

      - name: Fetch source files
        if: steps.missing.outputs.count != '0'
        run: git lfs pull --exclude=""

      - name: Initialize only meshoptimizer
        if: steps.missing.outputs.mesh != '0'
        run: git submodule update --init --depth 1 third_party/upstream/meshoptimizer

      # The bakes trace rays on Mitsuba's LLVM variant, on the libLLVM the runner holds.
      - name: Install the r3d requirements
        if: steps.missing.outputs.mesh != '0'
        run: python -m pip install -q --progress-bar off -r launcher/tools/r3d/requirements.txt

      - name: Install the sound requirements
        if: steps.missing.outputs.sound != '0'
        run: python -m pip install -q --progress-bar off -r launcher/tools/audio/requirements.txt

      - name: Bake
        if: steps.missing.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # The first command takes the earlier attempts' bakes of every kind into the cache.
          earlier=()
          if [ "$GITHUB_RUN_ATTEMPT" -gt 1 ]; then earlier=(--from-run "$GITHUB_RUN_ID"); fi
          python launcher/tools/bake/bake.py bake --kind blend --out "$RUNNER_TEMP/bakes" "${earlier[@]}"
          python scripts/lib/local_schedule.py start -- python launcher/tools/bake/bake.py bake --kind sh_probes --out "$RUNNER_TEMP/bakes"
          # One command: a texture's key names the bytes of the mesh or levels it draws on, made just before it.
          python scripts/lib/local_schedule.py start -- \
              python launcher/tools/bake/bake.py bake --kind mesh --kind levels --kind texture --out "$RUNNER_TEMP/bakes"
          python launcher/tools/bake/bake.py bake --kind sound --out "$RUNNER_TEMP/bakes"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() && steps.missing.outputs.count != '0' }}
        with:
          # The attempt last: a lock takes a key two attempts made from the later one.
          name: bakes-cpu-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bakes
          if-no-files-found: ignore

      # A fit's levels are its renderable output: once every one is made, the flythrough checks them here, before
      # anyone locks them. The lock written from the run's own uploads stays on the runner.
      - name: Lock this run's bakes on the runner
        if: steps.missing.outputs.levels != '0' && steps.missing.outputs.waiting == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python launcher/tools/bake/bake.py lock --from-run "$GITHUB_RUN_ID" --partial

      - name: Check the full camera flythrough of this run's levels for enclosed sky
        if: steps.missing.outputs.levels != '0' && steps.missing.outputs.waiting == '0'
        run: python -m unittest discover -s launcher/main/apps/render_lab/tools/tests -p test_sky_through_walls.py

      - uses: ./.github/actions/job-inputs
        if: ${{ !cancelled() }}
        with: {step: record}

  # Every missing reference set in one job: it selects each set's probe faces, traces all its poses and packs it.
  reference:
    needs: inputs
    if: ${{ !cancelled() && (needs.inputs.result != 'success' || needs.inputs.outputs.cpu != 'false') }}
    name: Trace and pack the missing reference sets
    runs-on: [self-hosted, linux, gpu-legion]
    timeout-minutes: 1440
    # actions: read lets a rerun take what its earlier attempts uploaded.
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Use a venv over the runner's environment
        run: |
          "$HOME/gpu/env/bin/python" -m venv --system-site-packages "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          echo "GPU_WORKFLOW=bakes.yml" >> "$GITHUB_ENV"

      - name: Whether a reference set is missing
        id: missing
        run: |
          python launcher/tools/bake/bake.py list --missing --kind reference | tee "$RUNNER_TEMP/reference.txt"
          echo "count=$(wc -l < "$RUNNER_TEMP/reference.txt")" >> "$GITHUB_OUTPUT"

      - name: Fetch source files
        if: steps.missing.outputs.count != '0'
        run: git lfs pull --exclude=""

      - name: Initialize only meshoptimizer
        if: steps.missing.outputs.count != '0'
        run: git submodule update --init --depth 1 third_party/upstream/meshoptimizer

      - name: Install the r3d requirements
        if: steps.missing.outputs.count != '0'
        run: python -m pip install -q --progress-bar off -r launcher/tools/r3d/requirements.txt

      - name: Trace and pack each set
        if: steps.missing.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A rerun first takes the sets its earlier attempts finished.
          earlier=()
          if [ "$GITHUB_RUN_ATTEMPT" -gt 1 ]; then earlier=(--from-run "$GITHUB_RUN_ID"); fi
          python scripts/lib/local_schedule.py start -- \
              python launcher/tools/bake/bake.py bake --kind reference --out "$RUNNER_TEMP/bakes" "${earlier[@]}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() && steps.missing.outputs.count != '0' }}
        with:
          # The attempt last: a lock takes a key two attempts made from the later one.
          name: bakes-reference-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bakes
          if-no-files-found: ignore

  lock:
    name: Lock is current
    # Also after a failed bake: a skipped required check would pass, and the check fails on the row it lacks.
    if: ${{ !cancelled() && (needs.inputs.result != 'success' || needs.inputs.outputs.lock != 'false') }}
    needs: [inputs, cpu, reference]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/job-inputs
        with: {step: arm}

      - uses: ./.github/actions/host-tools

      - name: Every needed key has a row and every row is needed
        run: python launcher/tools/bake/bake.py check

      - uses: ./.github/actions/job-inputs
        if: ${{ !cancelled() }}
        with: {step: record}

  sky-through-walls:
    name: Sky through walls
    # Not after a failed bake either: a skipped lock is no failure, and the bakes this run did not make cannot
    # be fetched, so this would only fail beside the job that failed.
    if: ${{ !cancelled() && needs.cpu.result != 'failure' && needs.reference.result != 'failure' && needs.lock.result != 'failure' && (needs.inputs.result != 'success' || needs.inputs.outputs.sky-through-walls != 'false') }}
    needs: [inputs, cpu, reference, lock]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/job-inputs
        with: {step: arm}

      - uses: ./.github/actions/host-tools

      - name: Fetch locked bakes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python launcher/tools/bake/bake.py fetch

      - name: Install the r3d requirements
        run: pip install -r launcher/tools/r3d/requirements.txt

      - name: Check the full camera flythrough for enclosed sky
        run: python -m unittest discover -s launcher/main/apps/render_lab/tools/tests -p test_sky_through_walls.py

      - uses: ./.github/actions/job-inputs
        if: ${{ !cancelled() }}
        with: {step: record}

  publish:
    name: Publish locked bakes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/host-tools

      - name: Upload each locked file the release lacks
        env:
          GH_TOKEN: ${{ github.token }}
        run: python launcher/tools/bake/bake.py publish
