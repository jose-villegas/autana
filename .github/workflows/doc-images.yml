name: Doc Images

# The host images and measured CPU tables are generated from the source.
# This regenerates them on main and, when pixels or table content changed,
# keeps ONE pull request "docs: refresh rendered images" up to date on
# a fixed branch. Nothing changed: nothing is committed, and a refresh PR that
# no longer has a diff is closed.
#
# Pixels are compared, never bytes: launcher/tools/render/compare_images.py.
# A pull request opened with GITHUB_TOKEN starts no other workflows, so its
# checks do not run until someone reopens it or pushes to its branch.
#
# The repository setting Actions > "Allow GitHub Actions to create and approve
# pull requests" must be on, or opening the PR fails.

on:
  push:
    branches: [main]
    paths:
      - 'launcher/**'
      - 'docs/**'
      - 'scripts/gates/check_doc_generated.py'
      - '.github/workflows/doc-images.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  pull-requests: write

# A build fetches the bakes launcher/bakes.lock names (bake/bake.py): from the
# release, or before main publishes them from the run that made them, which
# needs this token.
env:
  GH_TOKEN: ${{ github.token }}
  REFRESH_BRANCH: feature/refresh-doc-images

jobs:
  memory-tables:
    name: Measure internal memory (sequential variants)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/idf-build
        with:
          cache-name: release
          command: >-
            ../tools/autana build rel --project ..
      - uses: ./.github/actions/idf-build
        with:
          cache-name: dev
          command: ../tools/autana build dev --project ..
      - uses: ./.github/actions/idf-build
        with:
          cache-name: diag
          command: >-
            ../tools/autana build diag --project ..
            && cd ..
            && python3 launcher/tools/build/memory_map.py launcher/build launcher/build.dev launcher/build.diag --tables launcher/build/memory-tables
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: memory-tables
          path: launcher/build/memory-tables/

  refresh:
    name: Regenerate and compare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Identify mesh source LFS objects
        id: mesh-source
        run: |
          key=$(git lfs ls-files -l | awk '{print $1, $3}' | sha256sum | cut -d' ' -f1)
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "path=$(git rev-parse --git-path lfs)" >> "$GITHUB_OUTPUT"

      - name: Cache mesh source LFS objects
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.mesh-source.outputs.path }}
          key: mesh-source-lfs-${{ steps.mesh-source.outputs.key }}

      - name: Fetch mesh source files
        run: git lfs pull --exclude=""

      - name: Initialize meshoptimizer for scratch bakes
        run: git submodule update --init --depth 1 third_party/upstream/meshoptimizer

      - uses: ./.github/actions/host-tools

      # The bakes and the fidelity sheet trace rays on Mitsuba's LLVM variant, which needs libLLVM.
      # The doc generators span every tool folder, so every tool's requirements are installed.
      - name: Install the tool requirements and ffmpeg
        run: |
          pip install $(find launcher/tools -name requirements.txt -printf '-r %p ')
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg llvm
          ffmpeg -version | head -1

      # Exit 1 means an image or table changed, or an image is an orphan; an orphan or any exit
      # above 1 fails the job.
      - name: Render and compare
        id: render
        run: |
          set +e
          bash launcher/tools/render/render_doc_images.sh --check | tee "$RUNNER_TEMP/report.txt"
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -gt 1 ] || grep -q '^orphan ' "$RUNNER_TEMP/report.txt"; then
            echo "The images could not be checked (exit $code)." >&2
            exit 1
          fi
          grep '^changed ' "$RUNNER_TEMP/report.txt" > "$RUNNER_TEMP/changed.txt" || true
          echo "count=$(wc -l < "$RUNNER_TEMP/changed.txt")" >> "$GITHUB_OUTPUT"

      - name: Package rendered output
        run: |
          mkdir -p "$RUNNER_TEMP/rendered-docs"
          cp -a launcher/tools/results/doc_images/out/cpu "$RUNNER_TEMP/rendered-docs/cpu"
          cp "$RUNNER_TEMP/changed.txt" "$RUNNER_TEMP/rendered-docs/changed.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rendered-docs
          path: ${{ runner.temp }}/rendered-docs

  publish:
    name: Commit images and measured tables
    needs: [memory-tables, refresh]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/host-tools
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rendered-docs
          path: ${{ runner.temp }}/rendered-docs
      - name: Restore rendered output
        run: |
          out=launcher/tools/results/doc_images/out/cpu
          mkdir -p "$out"
          cp -a "$RUNNER_TEMP/rendered-docs/cpu/." "$out/"
          cp "$RUNNER_TEMP/rendered-docs/changed.txt" "$RUNNER_TEMP/changed.txt"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: memory-tables
          path: launcher/tools/results/doc_images/out/cpu/tables

      - name: Compare the generated memory tables and charts
        id: memory
        run: |
          set +e
          python launcher/tools/render/generated_blocks.py --root . \
            --tables launcher/tools/results/doc_images/out/cpu/tables --check > "$RUNNER_TEMP/memory-report.txt"
          code=$?
          set -e
          [ "$code" -le 1 ] || exit "$code"
          grep '^changed ' "$RUNNER_TEMP/memory-report.txt" >> "$RUNNER_TEMP/changed.txt" || true
          tables=launcher/tools/results/doc_images/out/cpu/tables
          while IFS= read -r -d '' chart; do
            name=${chart#"$tables/"}
            if ! cmp -s "$chart" "$name"; then
              echo "changed $name#chart" >> "$RUNNER_TEMP/changed.txt"
            fi
          done < <(find "$tables" -type f -name '*.svg' -print0)
          sort -u "$RUNNER_TEMP/changed.txt" -o "$RUNNER_TEMP/changed.txt"
          echo "count=$(wc -l < "$RUNNER_TEMP/changed.txt")" >> "$GITHUB_OUTPUT"

      - name: Nothing changed, close a stale refresh PR
        if: steps.memory.outputs.count == '0' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/ci/refresh_pr.py close \
            "Every rendered image and generated table already matches main; nothing left to refresh."

      - name: Commit the changed images and tables and open or update the PR
        if: steps.memory.outputs.count != '0' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out=launcher/tools/results/doc_images/out/cpu
          images=()
          while IFS= read -r line; do
            name=${line#changed }
            name=${name%%:*}
            case "$name" in *\#*) continue ;; esac
            mkdir -p "docs/images/$(dirname "$name")"
            cp "$out/$name" "docs/images/$name"
            images+=("docs/images/$name")
          done < "$RUNNER_TEMP/changed.txt"
          while IFS= read -r -d '' chart; do
            name=${chart#"$out/tables/"}
            mkdir -p "$(dirname "$name")"
            cp "$chart" "$name"
            images+=("$name")
          done < <(find "$out/tables" -type f -name '*.svg' -print0)
          # The run rendered its trigger commit; the branch is built on the current main from
          # the changed images and the tables (scripts/ci/refresh_branch.py says why).
          set +e
          python scripts/ci/refresh_branch.py "$REFRESH_BRANCH" 'docs: refresh rendered images' \
            --tables "$out/tables" "${images[@]}"
          code=$?
          set -e
          if [ "$code" -eq 3 ]; then
            python scripts/ci/refresh_pr.py close \
              "Every rendered image and generated table already matches main; nothing left to refresh."
            exit 0
          fi
          [ "$code" -eq 0 ] || exit "$code"

          {
            echo "The rendered images or measured tables no longer match what \`main\` renders. Regenerated by \`launcher/tools/render/render_doc_images.sh\` on ${GITHUB_SHA::7}."
            echo
            echo "Checks do not start on a PR opened by the workflow: close and reopen it to run CI."
            echo
            echo "| Image or table | Change |"
            echo "|---|---|"
            sed -e 's/^changed \([^:]*\): \(.*\)$/| `\1` | \2 |/' "$RUNNER_TEMP/changed.txt" | sed 's/^changed \(.*\)$/| `\1` | regenerated table |/'
          } > "$RUNNER_TEMP/body.md"

          python scripts/ci/refresh_pr.py sync 'docs: refresh rendered images' "$RUNNER_TEMP/body.md"
