name: Doc Images

# The host images and measured CPU tables are generated from the source.
# This regenerates them on main and, when pixels or table content changed,
# keeps ONE pull request "docs: refresh rendered images" up to date on
# a fixed branch. Nothing changed: nothing is committed, and a refresh PR that
# no longer has a diff is closed.
#
# Pixels are compared, never bytes: launcher/tools/render/compare_images.py.
# A pull request opened with GITHUB_TOKEN starts no other workflows, so its
# checks do not run until someone reopens it or pushes to its branch.
#
# The repository setting Actions > "Allow GitHub Actions to create and approve
# pull requests" must be on, or opening the PR fails.

on:
  push:
    branches: [main]
    paths:
      - 'launcher/**'
      - 'docs/**'
      - 'scripts/gates/check_doc_generated.py'
      - '.github/workflows/doc-images.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  REFRESH_BRANCH: feature/refresh-doc-images

jobs:
  refresh:
    name: Regenerate and compare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Identify mesh source LFS objects
        id: mesh-source
        run: |
          key=$(git lfs ls-files -l --include='launcher/main/apps/render_lab/meshes/sponza/**' | awk '{print $1, $3}' | sha256sum | cut -d' ' -f1)
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "path=$(git rev-parse --git-path lfs)" >> "$GITHUB_OUTPUT"

      - name: Cache mesh source LFS objects
        uses: actions/cache@v4
        with:
          path: ${{ steps.mesh-source.outputs.path }}
          key: mesh-source-lfs-${{ steps.mesh-source.outputs.key }}

      - name: Fetch mesh source files
        run: git lfs pull --include='launcher/main/apps/render_lab/meshes/sponza/**' --exclude=''

      - name: Initialize meshoptimizer for scratch bakes
        run: git submodule update --init --depth 1 third_party/upstream/meshoptimizer

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # The fidelity sheet traces the source model: trimesh, embreex and scipy.
      - name: Install Pillow, the r3d requirements and ffmpeg
        run: |
          pip install -r launcher/tools/r3d/requirements.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      # Exit 1 means an image or table changed, or an image is an orphan; an orphan or any exit
      # above 1 fails the job.
      - name: Render and compare
        id: render
        run: |
          set +e
          bash launcher/tools/render/render_doc_images.sh --check | tee "$RUNNER_TEMP/report.txt"
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -gt 1 ] || grep -q '^orphan ' "$RUNNER_TEMP/report.txt"; then
            echo "The images could not be checked (exit $code)." >&2
            exit 1
          fi
          grep '^changed ' "$RUNNER_TEMP/report.txt" > "$RUNNER_TEMP/changed.txt" || true
          echo "count=$(wc -l < "$RUNNER_TEMP/changed.txt")" >> "$GITHUB_OUTPUT"

      - name: Nothing changed, close a stale refresh PR
        if: steps.render.outputs.count == '0' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh pr list --head "$REFRESH_BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh pr close "$number" --delete-branch \
              --comment "Every rendered image and generated table already matches main; nothing left to refresh."
          fi

      - name: Commit the changed images and tables and open or update the PR
        if: steps.render.outputs.count != '0' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out=launcher/tools/results/doc_images/out/cpu
          git switch -C "$REFRESH_BRANCH"
          while IFS= read -r line; do
            name=${line#changed }
            name=${name%%:*}
            case "$name" in *\#*) continue ;; esac
            mkdir -p "docs/images/$(dirname "$name")"
            cp "$out/$name" "docs/images/$name"
          done < "$RUNNER_TEMP/changed.txt"
          python launcher/tools/render/generated_blocks.py --tables "$out/tables"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/images
          git ls-files -z -- '*.md' | xargs -0 git add --
          git commit -m 'docs: refresh rendered images'
          git push --force origin "$REFRESH_BRANCH"

          {
            echo "The rendered images or measured tables no longer match what \`main\` renders. Regenerated by \`launcher/tools/render/render_doc_images.sh\` on ${GITHUB_SHA::7}."
            echo
            echo "Checks do not start on a PR opened by the workflow: close and reopen it to run CI."
            echo
            echo "| Image or table | Change |"
            echo "|---|---|"
            sed -e 's/^changed \([^:]*\): \(.*\)$/| `\1` | \2 |/' "$RUNNER_TEMP/changed.txt" | sed 's/^changed \(.*\)$/| `\1` | regenerated table |/'
          } > "$RUNNER_TEMP/body.md"

          number=$(gh pr list --head "$REFRESH_BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh pr edit "$number" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base main --head "$REFRESH_BRANCH" \
              --title 'docs: refresh rendered images' --body-file "$RUNNER_TEMP/body.md"
          fi
