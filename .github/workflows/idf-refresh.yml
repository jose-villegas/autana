name: ESP-IDF refresh

# Everything that moves with ESP-IDF, refreshed where ESP-IDF is: once a week
# this pins the newest image of launcher/idf-pin.json's tag (its commit and
# esp-clang read from inside it), re-solves launcher/dependencies.lock to the
# newest components its manifests allow, rebuilds the three variants and
# rewrites the IRAM budgets they measure, then opens one pull request with all
# of it. Anything else a check finds is named by that check. A newer release
# line (release-v6.1 for release-v5.5) is a migration: the run warns about it
# and changes nothing. Every other framework's bump comes from Renovate
# (.github/renovate.json5); docs/tools/Framework-Versions.md has both.

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: idf-refresh
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  REFRESH_BRANCH: feature/esp-idf-refresh
  GH_TOKEN: ${{ github.token }}

jobs:
  refresh:
    name: Pin the newest ESP-IDF image and components
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/host-tools

      - name: Newer release lines are migrations
        run: |
          newer=$(curl -fsSL 'https://hub.docker.com/v2/repositories/espressif/idf/tags?name=release-v&page_size=100' \
            | python3 scripts/deps/idf_pin.py newer-line)
          if [ -n "$newer" ]; then
            echo "::warning::ESP-IDF $newer exists, newer than the pinned line: moving to it is a migration with its own ticket."
          fi

      - name: Pin the newest image of the tag
        id: pin
        run: |
          echo "before=$(python3 scripts/deps/idf_pin.py show commit)" >> "$GITHUB_OUTPUT"
          tag=$(python3 scripts/deps/idf_pin.py show tag)
          docker pull -q "espressif/idf:$tag"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "espressif/idf:$tag")
          date=$(docker inspect --format '{{.Created}}' "espressif/idf:$tag" | cut -c1-10)
          docker run --rm -v "$GITHUB_WORKSPACE:/app" -w /app "espressif/idf:$tag" /bin/bash -c \
            'git config --global --add safe.directory "*" && python3 scripts/deps/idf_pin.py write --image "$0" --date "$1"' \
            "espressif/idf:$tag@${digest#*@}" "$date"
          echo "after=$(python3 scripts/deps/idf_pin.py show commit)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/idf-build
        with:
          cache-name: idf-refresh
          lock-may-change: 'true'
          command: >-
            idf.py -B build.deps update-dependencies
            && ../tools/autana build rel --project ..
            && ../tools/autana build dev --project ..
            && ../tools/autana build diag --project ..
            && cd ..
            && python3 launcher/tools/build/memory_map.py launcher/build launcher/build.dev launcher/build.diag --write

      - name: Nothing moved, close a stale refresh PR
        id: changed
        run: |
          if git diff --quiet; then
            python scripts/ci/refresh_pr.py close "ESP-IDF, its components and the budgets they measure already match main."
            echo "any=false" >> "$GITHUB_OUTPUT"
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit the refresh and open or update the PR
        if: steps.changed.outputs.any == 'true'
        env:
          BEFORE: ${{ steps.pin.outputs.before }}
          AFTER: ${{ steps.pin.outputs.after }}
        run: |
          git switch -c "$REFRESH_BRANCH"
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -qam 'build: refresh ESP-IDF, its components and the budgets they measure'
          git push -q --force origin "$REFRESH_BRANCH"
          {
            echo "The newest \`$(python3 scripts/deps/idf_pin.py show tag)\` image and the newest components its manifests allow, made by \`.github/workflows/idf-refresh.yml\` on ${GITHUB_SHA::7}."
            echo
            if [ "$BEFORE" != "$AFTER" ]; then
              echo "ESP-IDF: [\`${BEFORE::10}\` → \`${AFTER::10}\`](https://github.com/espressif/esp-idf/compare/$BEFORE...$AFTER)"
              echo
            fi
            echo "| File | Change |"
            echo "|---|---|"
            git diff --numstat HEAD~1 | awk '{printf "| `%s` | +%s −%s |\n", $3, $1, $2}'
            echo
            echo "Checks do not start on a PR opened by the workflow: close and reopen it to run CI."
            echo
            echo "Ticket: xwxi"
          } > "$RUNNER_TEMP/body.md"
          python scripts/ci/refresh_pr.py sync 'build: refresh ESP-IDF, its components and the budgets they measure' "$RUNNER_TEMP/body.md"
