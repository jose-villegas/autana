name: Architecture

# Rebuilds the C4 architecture explorer from main and serves it on GitHub
# Pages under /architecture/. launcher/tools/architecture/build.py reads the
# tree, so every push to main leaves the page current; nothing is committed.
#
# The repository setting Pages > Source must be "GitHub Actions", or the
# deploy step fails.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build the explorer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: python3 launcher/tools/architecture/build.py -o _site/architecture
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Publish to Pages
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}architecture/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
