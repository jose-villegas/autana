name: Architecture

# Rebuilds the C4 architecture explorer from main and serves it on GitHub
# Pages under /architecture/. The generator lives in the private development
# repository, checked out as .dev the way a local checkout holds it, so every
# push to main leaves the page current and nothing generated is committed.
#
# Needs the repository setting Pages > Source set to "GitHub Actions", and a
# secret AUTANA_DEV_TOKEN that can read jose-villegas/autana-dev.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build the explorer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: jose-villegas/autana-dev
          token: ${{ secrets.AUTANA_DEV_TOKEN }}
          path: .dev
      - name: Test the generator
        run: python3 .dev/launcher/tools/architecture/test_build.py
      - name: Build
        run: python3 .dev/launcher/tools/architecture/build.py -o _site/architecture
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Publish to Pages
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}architecture/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
