name: Board health

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

concurrency:
  group: board-health
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  boards:
    runs-on: [self-hosted, windows, board]
    timeout-minutes: 10
    defaults:
      run:
        shell: 'C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -eo pipefail {0}'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        env:
          GIT_CONFIG_COUNT: '4'
          GIT_CONFIG_KEY_0: core.hooksPath
          GIT_CONFIG_VALUE_0: /dev/null
          GIT_CONFIG_KEY_1: filter.lfs.process
          GIT_CONFIG_VALUE_1: ''
          GIT_CONFIG_KEY_2: filter.lfs.smudge
          GIT_CONFIG_VALUE_2: ''
          GIT_CONFIG_KEY_3: filter.lfs.required
          GIT_CONFIG_VALUE_3: 'false'
        with:
          lfs: false
          persist-credentials: false
          set-safe-directory: false

      # This machine's boards and those the nightly reaches on other machines.
      - name: List boards on USB
        env:
          REMOTE_LANE_COMMAND: ${{ vars.REMOTE_LANE_COMMAND }}
        run: |
          export PATH="$(cygpath -u "$GITHUB_WORKSPACE")/tools:$PATH"
          PY=$(. scripts/lib/python.sh && find_python)
          "$PY" launcher/tools/perf/nightly/scoped_chain.py boards > "$RUNNER_TEMP/devices.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: board-health-devices-${{ github.run_attempt }}
          path: ${{ runner.temp }}/devices.json
          if-no-files-found: error

  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      issues: write
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: false
          persist-credentials: false

      - name: Wait for the USB probe unless the night is running
        id: probe
        run: python3 scripts/ci/board_alarm.py probe --devices "$RUNNER_TEMP/devices.json" --reason-file "$RUNNER_TEMP/board-alarm-reason"

      # The nightly creates perf-data on its first run; until then there are no lanes to check.
      - name: Look for the nightly's perf-data branch
        id: data
        if: steps.probe.outputs.enabled == 'true'
        run: |
          if git ls-remote --exit-code --heads origin perf-data > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            status=$?
            [ "$status" -eq 2 ] || exit "$status"
            echo "::notice::Board health: no perf-data branch yet (no nightly has run); nothing to check"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.data.outputs.exists == 'true'
        with:
          ref: perf-data
          path: perf-data
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Check board health
        if: steps.data.outputs.exists == 'true'
        run: python3 scripts/ci/board_alarm.py check --lanes-from perf-data --devices "$RUNNER_TEMP/devices.json" --reason-file "$RUNNER_TEMP/board-alarm-reason"

      - name: Report health check failures
        if: failure()
        run: python3 scripts/ci/board_alarm.py raise --reason-file "$RUNNER_TEMP/board-alarm-reason"
