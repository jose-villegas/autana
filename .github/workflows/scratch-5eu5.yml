name: scratch 5eu5
on:
  push:
    branches: [feature/bake-determinism]
jobs:
  dump:
    strategy:
      fail-fast: false
      matrix:
        job: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: LFS key
        id: lfs
        run: |
          echo "key=$(git lfs ls-files -l | awk '{print $1, $3}' | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "path=$(git rev-parse --git-path lfs)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.lfs.outputs.path }}
          key: mesh-source-lfs-${{ steps.lfs.outputs.key }}
      - run: git lfs pull --exclude="" && git submodule update --init --depth 1 third_party/upstream/meshoptimizer
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          pip install -r launcher/tools/r3d/requirements.txt
          sudo apt-get update && sudo apt-get install -y --no-install-recommends llvm
          grep -m1 "model name" /proc/cpuinfo; nproc; dpkg -l | grep libllvm; g++ --version | head -1
          python -c "import numpy; numpy.show_runtime()"
      - name: dump three ways
        run: |
          python -c "import drjit as dr, mitsuba as mi; mi.set_variant('llvm_ad_rgb'); print('llvm', dr.detail.llvm_version())"
          grep -m1 "model name" /proc/cpuinfo | tee cpu.txt
          python launcher/tools/r3d/stage_dump.py launcher/demo/sponza/sponza.scene.toml atrium > default.jsonl
          PIN_JIT="haswell;+avx2,+fma,+avx,+sse4.2,+f16c,+bmi,+bmi2,+lzcnt,+popcnt,+movbe;8" python launcher/tools/r3d/stage_dump.py launcher/demo/sponza/sponza.scene.toml atrium > pin.jsonl
          NPY_DISABLE_CPU_FEATURES="X86_V4 AVX512_ICL" PIN_JIT="haswell;+avx2,+fma,+avx,+sse4.2,+f16c,+bmi,+bmi2,+lzcnt,+popcnt,+movbe;8" python launcher/tools/r3d/stage_dump.py launcher/demo/sponza/sponza.scene.toml atrium > pin-npy.jsonl
          tail -n1 default.jsonl pin.jsonl pin-npy.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dump-${{ matrix.job }}
          path: |
            *.jsonl
            cpu.txt
