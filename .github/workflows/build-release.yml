name: Build (Release)

# Compiles the real shipping firmware via Espressif's own CI action - no
# test code, nothing this can't ship as-is. An on-device run is out of reach:
# a hosted runner has no USB/serial access to a board. See
# docs/sand/Architecture.md's "Verifying performance on real hardware".

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-release:
    name: Build (release, esp32s3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: release-v5.5
          target: esp32s3
          path: launcher
          command: >-
            bash tools/build_flash.sh --build-only
            && tools/check_release_symbols.sh build/launcher.elf
