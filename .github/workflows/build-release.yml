name: Build (Release)

# Compiles the real shipping firmware via Espressif's own CI action - no
# test code, nothing this can't ship as-is. Own workflow file, separate from
# the diagnostics variant and the host test suite, purely so each gets its
# own status badge (GitHub exposes whole-workflow badges, never per-job
# ones).
#
# What this can't cover: an on-device run - GitHub-hosted runners have no
# USB/serial access to a real board. See
# docs/sand/Architecture.md's "Verifying performance on real hardware"
# section for that workflow.

on:
  push:
  pull_request:

jobs:
  build-release:
    name: Build (release, esp32s3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: release-v5.5
          target: esp32s3
          path: launcher
          command: >-
            bash tools/build_flash.sh --build-only
            && tools/check_release_symbols.sh build/launcher.elf
