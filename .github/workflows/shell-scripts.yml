name: Shell Scripts

# Every shell script in the repo, checked on Linux, which is the only place
# some of it can be checked at all.
#
# Development happens on Windows in Git Bash, where /bin/sh is bash wearing
# a hat: `sh -n` there accepts bashisms that a real POSIX shell rejects.
# launcher/tools/build/idf.sh's POSIX branch, the other thing Windows never runs,
# is what every firmware build workflow drives, through `autana build`.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  inputs:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      lint: ${{ steps.affected.outputs.lint }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: affected
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/job_inputs.py affected --job lint

  lint:
    needs: inputs
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.inputs.result != 'success' || needs.inputs.outputs.lint == 'true') }}
    name: Lint and POSIX check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/job-inputs
        with: {step: arm}

      # A shell script is what its first line says, not its name: tools/autana
      # and the pre-commit hook have no .sh, and a glob by name never saw them.
      - name: List every tracked sh or bash script
        run: |
          git ls-files -z | while IFS= read -r -d '' f; do
            first=""
            IFS= read -r first < "$f" 2>/dev/null || true
            if [[ $first =~ ^#!.*[/[:space:]](ba)?sh([[:space:]]|$) ]]; then
              printf '%s\n' "$f"
            fi
          done > "$RUNNER_TEMP/shell-scripts.txt"
          cat "$RUNNER_TEMP/shell-scripts.txt"

      - uses: ./.github/actions/host-tools

      - name: Host lock and night scheduling tests
        run: |
          python3 -m pip install pyserial -r scripts/gates/requirements.txt
          python3 -m unittest discover -s scripts/device/tests
          python3 scripts/gates/check_autana_source.py
          python3 -m unittest discover -s scripts/gates/tests -p test_check_autana_source.py
          python3 -m unittest discover -s launcher/tools/tune/tests
          python3 -m unittest discover -s scripts/ci/tests
          python3 -m unittest discover -s launcher/tools/perf/tests

      - name: Every script with a shebang is stored executable
        run: sh scripts/gates/check-exec-bits.sh

      # Ubuntu's /bin/sh IS dash, so this is a genuine POSIX parse; unlike
      # the same command run from Git Bash, which cannot fail this way.
      - name: POSIX syntax check every #!/bin/sh script
        run: |
          set -eu
          status=0
          for f in $(cat "$RUNNER_TEMP/shell-scripts.txt"); do
            if head -1 "$f" | grep -q '/bin/sh'; then
              printf 'dash -n %s ... ' "$f"
              if dash -n "$f"; then echo ok; else echo FAILED; status=1; fi
            fi
          done
          exit $status

      - name: bash syntax check every #!/usr/bin/env bash script
        run: |
          set -eu
          status=0
          for f in $(cat "$RUNNER_TEMP/shell-scripts.txt"); do
            if head -1 "$f" | grep -q 'bash'; then
              printf 'bash -n %s ... ' "$f"
              if bash -n "$f"; then echo ok; else echo FAILED; status=1; fi
            fi
          done
          exit $status

      # -S error to begin with: a floor, not a ceiling. shellcheck's style
      # and info findings on scripts written before it was wired up are worth
      # fixing, but not worth failing the build over on the day it lands;
      # raise this to warning once they are cleared rather than leaving the
      # gate permanently soft.
      - name: shellcheck (errors)
        run: shellcheck -S error $(cat "$RUNNER_TEMP/shell-scripts.txt")

      - uses: ./.github/actions/job-inputs
        if: ${{ !cancelled() }}
        with: {step: record}

  # The perf job replays drive the real perf_compare.sh / perf_sweep.sh
  # through Git Bash and native Python, whose signal and process-tree paths
  # differ from Linux; every shell_job test fails on a fake left running.
  windows-perf:
    name: Perf job replays (Windows)
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/host-tools
      - shell: bash
        run: |
          python -m pip install pyserial -r scripts/gates/requirements.txt
          python -m unittest discover -s launcher/tools/perf/tests
