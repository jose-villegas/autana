name: Comment Rules

# The comment rules docs/C-Style-Guide.md states, measured rather than
# argued: nothing beside code over 500 characters, no file header over 50
# lines, no comment naming a function that does not exist, and none below
# apps/ naming an app.
# Enforced here so the rules hold for every commit, however it was made.
#
# Own workflow file, like the other four, purely so it gets its own badge -
# GitHub exposes whole-workflow badges and never per-job ones. See
# host-tests.yml's top comment.

on:
  push:
  pull_request:

jobs:
  comment-rules:
    name: Comment rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Length beside code, and header height
        run: >
          python3 scripts/check_comment_length.py
          --no-banners --limit 500 --header-limit 50 --top 0

      - name: Every function a comment names exists
        run: python3 scripts/check_comment_symbols.py

      - name: No comment below apps/ names an app
        run: python3 scripts/check_comment_layers.py

      - name: Every documentation citation resolves
        run: python3 scripts/check_doc_citations.py

      - name: Documentation constants match source
        run: python3 scripts/check_doc_constants.py

      - name: Documentation names the supported board
        run: python3 scripts/check_doc_vocabulary.py

  # Own job, not a step above: a real clang-tidy AST pass over ~110 files
  # runs tens of seconds, not the sub-second cost every check above this
  # line pays - see launcher/tools/complexity_gate.py's own header and
  # docs/tools/Complexity-Gate.md for what the gate does and why it lives
  # here rather than in the pre-commit hook.
  complexity-ratchet:
    name: Cognitive complexity ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same major scripts/check-format.sh pins clang-format to, and for
      # the same reason: different clang-tidy majors score this check
      # differently. Wheel package, not apt, so the runner gets the exact
      # patch version regardless of image.
      - name: Install clang-tidy 19
        run: pip install 'clang-tidy==19.1.0.1'

      - name: Ratchet first-party cognitive complexity against the baseline
        run: python3 launcher/tools/complexity_gate.py
