name: Comment Rules

# The comment rules docs/c-style/README.md states, measured rather than
# argued: nothing beside code over 500 characters, no file header over 50
# lines, no comment citing a name, file or heading that is not there,
# none below apps/ naming an app, nor any engine document, and none
# recording where code moved.
# Alongside it, the tree-wide invariants documentation and tooling must
# hold: every citation, down to a named section, resolves, constants match
# source, and nothing outside scripts/device/ opens the board's serial port
# or names one of the board scripts the tree no longer has, and the shell's
# main.c includes and calls no firmware, only the modules that own it.
# check_style_audit.py holds the remaining decidable text and include
# rules, one decorated function each; its docstring says what was left
# out because a script cannot judge it reliably.
# The two citation gates run in their own job, inside the ESP-IDF image the
# firmware builds with: a name the firmware uses but does not define must
# resolve in ESP-IDF, and --require-idf fails the job rather than skip that
# check if the image ever stops carrying it.
# Enforced here so the rules hold for every commit, however it was made.
# The tooling's own suites run last, in the same job: they test these
# scripts, and are too small to be worth a runner of their own.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The tool tests build packs, whose meshes come from the bake cache (bake/bake.py): from the release, or before
# main publishes them from the run that made them, which needs this token.
env:
  GH_TOKEN: ${{ github.token }}

jobs:
  inputs:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      comment-rules: ${{ steps.affected.outputs.comment-rules }}
      generated-files: ${{ steps.affected.outputs.generated-files }}
      idf-image: ${{ steps.affected.outputs.idf-image == 'true' || steps.affected.outputs.citations == 'true' }}
      citations: ${{ steps.affected.outputs.citations }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: affected
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/job_inputs.py affected --job comment-rules --job generated-files --job idf-image --job citations

  comment-rules:
    needs: inputs
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.inputs.result != 'success' || needs.inputs.outputs.comment-rules == 'true') }}
    name: Comment rules and tool tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/job-inputs
        with: {step: arm}

      - uses: ./.github/actions/host-tools

      # Every install comes before the first gate: Tool tests runs after a
      # failed gate too, and a skipped install would fail it for nothing.
      # pyserial among them: the exclusive-open tests drive the real serial library on a pty.
      - name: Workflow gate dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2
          pip install -r scripts/gates/requirements.txt -r launcher/tools/render/requirements.txt -r launcher/test/device/requirements.txt -r launcher/tools/audio/requirements.txt -r launcher/tools/audio/mic/requirements.txt

      # test_r3d_bake.py skips itself without numpy and scipy, and builds
      # meshoptimizer's library from its submodule with the runner's compiler;
      # test_fbx_to_glb.py builds ufbx the same way;
      # test_r3d_ray_query.py checks the LLVM variant when libLLVM is there.
      - name: r3d bake environment
        run: |
          pip install -r launcher/tools/r3d/requirements.txt
          sudo apt-get install -y --no-install-recommends llvm
          git submodule update --init --depth 1 third_party/upstream/meshoptimizer third_party/upstream/ufbx

      # test_check_math.mjs renders through GitHub's MathJax.
      - name: Node gate dependencies
        run: npm ci --prefix scripts/gates

      - name: Self-hosted workflows reject untrusted pull request and comment events
        run: python3 scripts/gates/check_self_hosted_workflows.py

      - name: Length beside code, and header height
        env:
          STAGED_TEXT_GATE: "true"
        run: >
          python3 scripts/gates/check_comment_length.py
          --no-banners --limit 500 --header-limit 50 --top 0

      - name: Every source file says what it is
        env:
          STAGED_TEXT_GATE: "true"
        run: python3 scripts/gates/check_file_headers.py

      - name: No comment or engine document below apps/ names an app
        env:
          STAGED_TEXT_GATE: "true"
        run: python3 scripts/gates/check_comment_layers.py

      - name: No comment records where code moved
        env:
          STAGED_TEXT_GATE: "true"
        run: python3 scripts/gates/find_narrative_comments.py --tombstones

      - name: Generated document blocks pass their check command or hash
        env:
          STAGED_TEXT_GATE: "snapshot"
        run: python3 scripts/gates/check_doc_generated.py

      - name: Example embedder tests
        run: python3 -m unittest discover -s scripts/gates/tests -p test_examples_doc.py

      - name: Audio tables match the committed capture
        run: python3 launcher/tools/audio/audio_doc_tables.py --check

      - name: Voice frame-time tables match the committed comparison
        run: python3 launcher/tools/audio/sound_gate_tables.py --check

      - name: Voice frame-time table generator tests
        run: python3 -m unittest discover -s launcher/tools/audio/tests

      - name: Test microphone tools
        run: python3 -m unittest discover -s launcher/tools/audio/mic/tests

      - name: Audio table generator tests
        run: python3 -m unittest discover -s launcher/test -p test_audio_doc_tables.py

      - name: IRAM placement sites declare reasons and budgets
        run: python3 launcher/tools/build/memory_map.py --source-only

      - name: Documentation constants match source
        env:
          STAGED_TEXT_GATE: "snapshot"
        run: python3 scripts/gates/check_doc_constants.py

      - name: Format diagram fields carry their role's colour marker
        run: |
          python3 scripts/gates/check_format_roles.py
          python3 -m unittest discover -s scripts/gates/tests -p test_check_format_roles.py

      - name: Each package's pages name every function its headers define
        env:
          STAGED_TEXT_GATE: "snapshot"
        run: python3 scripts/gates/check_package_docs.py

      - name: Every document is reachable, and every anchor link resolves
        run: python3 scripts/gates/check_doc_index.py

      # The Doc Images job runs only on main, so an image no script makes
      # would otherwise pass here and fail it there.
      - name: Every image under docs/images/ is made by a script
        run: sh launcher/tools/render/render_doc_images.sh --orphans

      - name: The board is reached only through scripts/device/
        run: python3 scripts/gates/check_device_access.py

      - name: The shell includes and calls no firmware, and the clock and heap have one owner each
        run: python3 scripts/gates/check_shell_firmware.py

      - name: No tracker id, personal path, or misdirected include is tracked
        env:
          STAGED_TEXT_GATE: "true"
        run: python3 scripts/gates/check_style_audit.py

      # Warns, never fails: a changed function a document cites is a reason
      # to reread that document, not proof it is wrong.
      - name: Documents citing what this pull request changed
        if: github.event_name == 'pull_request'
        run: python3 scripts/gates/doc_citers.py --changed "origin/${{ github.base_ref }}"

      - name: No new token clone pairs
        run: python3 scripts/gates/check_clones.py --base "origin/${{ github.base_ref || 'main' }}"

      - name: No new magic numbers or protocol strings
        run: python3 scripts/gates/check_magic_numbers.py --base "origin/${{ github.base_ref || 'main' }}"

      - name: Simulation skip facts are read through the forced-work gate
        run: python3 scripts/gates/check_skip_facts.py

      - name: Each vendored copy is taken from its submodule's pinned commit
        run: python3 scripts/deps/vendored.py check

      # Python and, for check-mermaid.mjs's pure parts and check-math.mjs,
      # Node; scripts/run-tool-tests.sh owns which suites.
      - name: Tool tests
        if: ${{ !cancelled() }}
        run: sh scripts/run-tool-tests.sh

      - uses: ./.github/actions/job-inputs
        if: ${{ !cancelled() }}
        with: {step: record}

  # The generated-file sweep gets its own runner; banners define its inputs.
  generated-files:
    needs: inputs
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.inputs.result != 'success' || needs.inputs.outputs.generated-files == 'true') }}
    name: Every generated file is what its banner's command makes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/job-inputs
        with: {step: arm}

      - uses: ./.github/actions/host-tools

      - name: Generator dependencies
        run: pip install -r launcher/tools/render/requirements.txt

      # Each banner's command, rerun into a temporary folder; the sand
      # palette's builds with the runner's C compiler.
      - name: Every generated file is what its banner's command makes
        run: python3 scripts/gates/check_generated_files.py

      - uses: ./.github/actions/job-inputs
        if: ${{ !cancelled() }}
        with: {step: record}

  idf-image:
    needs: inputs
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.inputs.result != 'success' || needs.inputs.outputs.idf-image == 'true') }}
    name: Read the IDF pin
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.pin.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/job-inputs
        with: {step: arm}

      - id: pin
        run: echo "image=$(sh scripts/ci/idf_image.sh)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/job-inputs
        if: ${{ !cancelled() }}
        with: {step: record}

  citations:
    needs: [inputs, idf-image]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.inputs.result != 'success' || needs.inputs.outputs.citations == 'true') }}
    name: Every citation resolves, in this tree or in ESP-IDF
    runs-on: ubuntu-24.04
    container: ${{ needs.idf-image.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/job-inputs
        with: {step: arm}

      # The container runs as another user than the checkout's owner.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: The image is the ESP-IDF launcher/idf-pin.json records
        run: python3 scripts/deps/idf_pin.py check

      - name: Every name, file and heading a comment cites exists
        env:
          STAGED_TEXT_GATE: "true"
        run: python3 scripts/gates/check_comment_symbols.py --require-idf

      - name: Every documentation citation resolves
        run: python3 scripts/gates/check_doc_citations.py --require-idf

      - uses: ./.github/actions/job-inputs
        if: ${{ !cancelled() }}
        with: {step: record}
