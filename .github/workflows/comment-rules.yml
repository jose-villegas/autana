name: Comment Rules

# The comment rules docs/C-Style-Guide.md states, measured rather than
# argued: nothing beside code over 500 characters, no file header over 50
# lines, no comment naming a function that does not exist, none below
# apps/ naming an app, and none recording where code moved. Alongside it,
# the tree-wide invariants documentation and tooling must hold: every
# citation (including a doc's own section) resolves, constants match
# source, and nothing outside scripts/device/ opens the board's serial port
# or names one of the board scripts the tree no longer has.
# check_style_audit.py holds what neither of those covers: no tracker id or
# commit hash, calendar date, "living document" line, personal path,
# misdirected or unqualified include, stray HTML comment, or accidental
# Markdown bullet in tracked text - each rule is one decorated function in
# the script, and its docstring says what was left out because a script
# cannot judge it reliably.
# Enforced here so the rules hold for every commit, however it was made.
#
# Own workflow file, like the others, purely so it gets its own badge -
# GitHub exposes whole-workflow badges and never per-job ones. See
# host-tests.yml's top comment.

on:
  push:
  pull_request:

jobs:
  comment-rules:
    name: Comment rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Length beside code, and header height
        run: >
          python3 scripts/gates/check_comment_length.py
          --no-banners --limit 500 --header-limit 50 --top 0

      - name: Every function a comment names exists
        run: python3 scripts/gates/check_comment_symbols.py

      - name: No comment below apps/ names an app
        run: python3 scripts/gates/check_comment_layers.py

      - name: No comment records where code moved
        run: python3 scripts/gates/find_narrative_comments.py --tombstones

      - name: Every documentation citation resolves
        run: python3 scripts/gates/check_doc_citations.py

      - name: Documentation constants match source
        run: python3 scripts/gates/check_doc_constants.py

      - name: Documentation names the supported board
        run: python3 scripts/gates/check_doc_vocabulary.py

      - name: Every document is reachable, and every anchor link resolves
        run: python3 scripts/gates/check_doc_index.py

      - name: The board is reached only through scripts/device/
        run: python3 scripts/gates/check_device_access.py

      - name: No tracker id, personal path, or misdirected include is tracked
        run: python3 scripts/gates/check_style_audit.py

      # Warns, never fails: a changed function a document cites is a reason
      # to reread that document, not proof it is wrong.
      - name: Documents citing what this pull request changed
        if: github.event_name == 'pull_request'
        run: python3 scripts/gates/doc_citers.py --changed "origin/${{ github.base_ref }}"
