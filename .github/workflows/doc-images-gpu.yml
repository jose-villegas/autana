name: GPU Doc Images

# The GPU stage holds the one GPU runner for hours, so it runs only when what it is made from changed.
# A hosted job takes the stage's input fingerprint (render_doc_images.sh --stage gpu --inputs: the code
# it runs, the host renderer's compile, the scene and its locked bakes) and stops there when a finished
# run recorded the same one, as an artifact named RECORD_PREFIX<fingerprint>. Otherwise the run waits
# for any GPU run ahead of it, looks again, and only then renders. A dispatch with force always renders.
on:
  workflow_dispatch:
    inputs:
      force:
        description: Render even when a finished run recorded these inputs
        type: boolean
        default: false
  schedule:
    - cron: '0 3 * * *'
  push:
    branches: [main]

permissions:
  actions: read
  contents: write
  pull-requests: write

# A build fetches the bakes launcher/bakes.lock names (bake/bake.py): from the
# release, or before main publishes them from the run that made them, which
# needs this token.
env:
  GH_TOKEN: ${{ github.token }}
  REFRESH_BRANCH: feature/refresh-doc-images-gpu
  MPLBACKEND: Agg
  RECORD_PREFIX: doc-images-inputs-
  FORCE: ${{ inputs.force }}

jobs:
  fingerprint:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      fingerprint: ${{ steps.inputs.outputs.fingerprint }}
      current: ${{ steps.inputs.outputs.current }}
    steps:
      - uses: actions/checkout@v4

      - name: Fingerprint the GPU stage's inputs
        id: inputs
        run: |
          fingerprint=$(sh launcher/tools/render/render_doc_images.sh --stage gpu --inputs)
          current=false
          [ "$FORCE" = true ] || current=$(sh scripts/ci/inputs_recorded.sh "$RECORD_PREFIX$fingerprint")
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [ "$current" = true ]; then
            echo "doc images current: a finished run recorded inputs $fingerprint"
          else
            echo "inputs $fingerprint: no finished run recorded them${FORCE:+ (force: $FORCE)}"
          fi

  # Waits for a GPU run ahead of it to finish, then looks again: that run may have recorded these inputs.
  queue:
    needs: fingerprint
    if: needs.fingerprint.outputs.current != 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: doc-images-gpu
      cancel-in-progress: false
    outputs:
      current: ${{ steps.recorded.outputs.current }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci

      - name: Look for the inputs again
        id: recorded
        env:
          FINGERPRINT: ${{ needs.fingerprint.outputs.fingerprint }}
        run: |
          current=false
          [ "$FORCE" = true ] || current=$(sh scripts/ci/inputs_recorded.sh "$RECORD_PREFIX$FINGERPRINT")
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [ "$current" = true ]; then echo "doc images current: the run ahead recorded inputs $FINGERPRINT"; fi

  refresh:
    needs: [fingerprint, queue]
    if: needs.queue.result == 'success' && needs.queue.outputs.current != 'true'
    runs-on: [self-hosted, linux, gpu]
    timeout-minutes: 1440
    concurrency:
      group: doc-images-gpu
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Fetch mesh source files
        run: git lfs pull --exclude=""

      - name: Initialize only meshoptimizer
        run: git submodule update --init --depth 1 third_party/upstream/meshoptimizer

      - name: Install the stage requirements into the GPU environment
        run: |
          "$HOME/gpu/env/bin/python" -m pip install \
            -r launcher/tools/r3d/requirements.txt

      - name: GPU memory before the full stage
        run: nvidia-smi --query-gpu=name,memory.total,memory.used,memory.free --format=csv

      - name: Run the full GPU stage
        run: sh launcher/tools/render/render_doc_images.sh --stage gpu

      - name: GPU memory after the full stage
        if: always()
        run: nvidia-smi --query-gpu=name,memory.total,memory.used,memory.free --format=csv

      - name: Compare pixels and stage changed images and GPU tables
        id: render
        run: |
          while IFS= read -r -d '' image; do
            if git cat-file -e "HEAD:$image" 2>/dev/null; then
              git show "HEAD:$image" > "$RUNNER_TEMP/before.png"
              set +e
              "$HOME/gpu/env/bin/python" launcher/tools/render/compare_images.py \
                "$RUNNER_TEMP/before.png" "$image"
              code=$?
              set -e
              if [ "$code" -gt 1 ]; then exit "$code"; fi
              if [ "$code" -eq 0 ]; then git restore -- "$image"; fi
            fi
          done < <(find docs/images/render/gpu -type f -name '*.png' -print0)
          git add docs/images/render/gpu
          git ls-files -z -- '*.md' | xargs -0 git add --
          git diff --cached --name-only > "$RUNNER_TEMP/changed.txt"
          echo "count=$(wc -l < "$RUNNER_TEMP/changed.txt")" >> "$GITHUB_OUTPUT"

      - name: Nothing changed, close a stale GPU refresh PR
        if: steps.render.outputs.count == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$HOME/gpu/env/bin/python" scripts/ci/refresh_pr.py close \
            "Every GPU-rendered image and generated table already matches main; nothing left to refresh."

      - name: Commit changes and open or update the GPU refresh PR
        if: steps.render.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The run rendered its trigger commit; the branch is built on the current main from
          # the changed images and the tables (scripts/ci/refresh_branch.py says why).
          mapfile -t images < <(git diff --cached --name-only HEAD -- docs/images/render/gpu)
          set +e
          "$HOME/gpu/env/bin/python" scripts/ci/refresh_branch.py "$REFRESH_BRANCH" \
            'docs: refresh GPU-rendered images' \
            --tables launcher/tools/results/doc_images/out/gpu/tables "${images[@]}"
          code=$?
          set -e
          if [ "$code" -eq 3 ]; then
            "$HOME/gpu/env/bin/python" scripts/ci/refresh_pr.py close \
              "Every GPU-rendered image and generated table already matches main; nothing left to refresh."
            exit 0
          fi
          [ "$code" -eq 0 ] || exit "$code"
          {
            echo "GPU-rendered images or generated tables differ from main. Regenerated by launcher/tools/render/render_doc_images.sh --stage gpu on ${GITHUB_SHA::7}."
            echo
            echo "Checks do not start on a PR opened by the workflow: close and reopen it to run CI."
            echo
            echo "Changed files:"
            sed 's/^/- /' "$RUNNER_TEMP/changed.txt"
          } > "$RUNNER_TEMP/body.md"
          "$HOME/gpu/env/bin/python" scripts/ci/refresh_pr.py sync 'docs: refresh GPU-rendered images' "$RUNNER_TEMP/body.md"

      # Last, so only a run that published (or found nothing to publish) records its inputs. The stage
      # fingerprints them itself; a mismatch with the hosted job's would make every later run render.
      - name: Check the stage rendered the inputs the hosted job fingerprinted
        env:
          FINGERPRINT: ${{ needs.fingerprint.outputs.fingerprint }}
        run: |
          source=launcher/tools/results/doc_images/out/gpu/source.json
          rendered=$("$HOME/gpu/env/bin/python" -c 'import json, sys; print(json.load(open(sys.argv[1]))["source"])' "$source")
          if [ "$rendered" != "$FINGERPRINT" ]; then
            echo "the stage rendered inputs $rendered but the hosted job fingerprinted $FINGERPRINT;" \
              "the fingerprint differs between the two machines ($source lists each input)" >&2
            exit 1
          fi

      - name: Record the inputs these images were made from
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RECORD_PREFIX }}${{ needs.fingerprint.outputs.fingerprint }}
          path: launcher/tools/results/doc_images/out/gpu/source.json
          retention-days: 90
