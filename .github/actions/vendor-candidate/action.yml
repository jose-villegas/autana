name: Vendor candidate
description: >-
  Whether this candidate runner does its job: of a job's candidates, the first whose CPU vendor is the lock's
  does it (scripts/ci/runner_vendor.py). A job with nothing traced needs no vendor, and candidate 0 does it.
  Needs `actions: read`.
inputs:
  unit:
    description: The job's name without " (candidate N)".
    required: true
  candidate:
    description: This runner's candidate number, matrix.candidate.
    required: true
  traces:
    description: '"true" when the job has traced work.'
    default: "true"
  done:
    description: A glob of the artifact names an earlier attempt uploaded once it did the job; empty for none.
    default: ""
outputs:
  work:
    description: '"true" for the candidate that does the job.'
    value: ${{ steps.claim.outputs.work || steps.mark.outputs.work }}
runs:
  using: composite
  steps:
    # Before any install: which CPU vendor this runner is, as an artifact the job's other candidates read.
    - id: mark
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        UNIT: ${{ inputs.unit }}
        CANDIDATE: ${{ inputs.candidate }}
        TRACES: ${{ inputs.traces }}
        DONE: ${{ inputs.done }}
      run: python3 scripts/ci/runner_vendor.py mark "$UNIT" "$CANDIDATE" "$RUNNER_TEMP/vendor" "$TRACES" "$DONE"

    - if: steps.mark.outputs.marker != ''
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ${{ steps.mark.outputs.marker }}
        path: ${{ runner.temp }}/vendor
        retention-days: 1

    # Fails, for bakes-vendor-rerun.yml, only when no candidate of this attempt is the lock's vendor.
    - id: claim
      if: steps.mark.outputs.marker != ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        UNIT: ${{ inputs.unit }}
        CANDIDATE: ${{ inputs.candidate }}
        VENDOR_MARKER: ${{ steps.mark.outputs.marker }}
      run: python3 scripts/ci/runner_vendor.py claim "$UNIT" "$CANDIDATE"
