name: Merge a ref
description: >-
  Merge a branch or commit of this repository into the checkout, in the
  runner only. Fails on a conflict.

inputs:
  ref:
    description: Branch name or commit to fetch and merge.
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        REF: ${{ inputs.ref }}
      run: |
        git config user.name "Pages build"
        git config user.email "pages-build@users.noreply.github.com"
        git fetch origin "$REF"
        git merge --no-edit FETCH_HEAD
