name: ESP-IDF build
description: >-
  Run a command from launcher/ inside the ESP-IDF container, with the
  container's ccache kept across runs.

# The image already builds through ccache (IDF_CCACHE_ENABLE=1); its cache
# just dies with the container. One key prefix per variant, because a
# restore takes the newest entry under its prefix: shared, each job would get
# whichever variant saved last, with a different sdkconfig.h, and mostly miss.

inputs:
  cache-name:
    description: Names this build's ccache, one per variant.
    required: true
  command:
    description: Shell command run from launcher/; no single quotes.
    required: true

runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/ccache
        key: idf-ccache-${{ inputs.cache-name }}-${{ github.sha }}
        restore-keys: idf-ccache-${{ inputs.cache-name }}-

    # COMPILERCHECK=content: the release-v5.5 tag is rebuilt in place, and
    # hashing the compiler driver is cheap next to trusting the image to keep
    # its timestamps honest.
    - uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: release-v5.5
        target: esp32s3
        path: launcher
        extra_docker_args: >-
          -v ${{ runner.temp }}/ccache:/ccache
          -e CCACHE_DIR=/ccache
          -e CCACHE_MAXSIZE=500M
          -e CCACHE_COMPILERCHECK=content
        command: ccache -z > /dev/null && ${{ inputs.command }} && ccache -s
