name: ESP-IDF build
description: >-
  Run a command from launcher/ inside the ESP-IDF container, with the
  container's ccache kept across runs.

# The image already builds through ccache (IDF_CCACHE_ENABLE=1); its cache
# just dies with the container. One key prefix per variant, because a
# restore takes the newest entry under its prefix: shared, each job would get
# whichever variant saved last, with a different sdkconfig.h, and mostly miss.

inputs:
  cache-name:
    description: Names this build's ccache, one per variant.
    required: true
  command:
    description: Shell command run from launcher/.
    required: true
  lock-may-change:
    description: >-
      'true' when the command re-solves launcher/dependencies.lock on purpose
      (the ESP-IDF refresh); otherwise a changed lock fails the build.
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.temp }}/ccache
        key: idf-ccache-${{ inputs.cache-name }}-${{ github.sha }}
        restore-keys: idf-ccache-${{ inputs.cache-name }}-

    - uses: ./.github/actions/host-tools

    - name: Fetch the bakes launcher/bakes.lock names
      shell: bash
      run: python3 launcher/tools/bake/bake.py fetch --cache "${{ runner.temp }}/bakes"

    - name: The image is the ESP-IDF launcher/idf-pin.json records
      shell: bash
      run: sh scripts/ci/in_idf_image.sh launcher 'python3 ../scripts/deps/idf_pin.py check'

    # MAXSIZE is about four times one variant's fresh cache: each save carries
    # forward all it restored, and every variant and commit shares the repository's
    # 10 GB of Actions cache.
    - name: Build in the pinned IDF image
      shell: bash
      env:
        BUILD_COMMAND: ${{ inputs.command }}
        CCACHE_MAXSIZE: 150M
      run: sh scripts/ci/in_idf_image.sh launcher "$BUILD_COMMAND"

    # launcher/dependencies.lock is the owner of every component version a
    # build uses; the component manager rewrites it rather than fail when the
    # manifests or the ESP-IDF version no longer match it.
    - name: The build used launcher/dependencies.lock as committed
      if: inputs.lock-may-change != 'true'
      shell: bash
      run: |
        if ! git diff --quiet -- launcher/dependencies.lock; then
          git diff -- launcher/dependencies.lock
          echo "::error file=launcher/dependencies.lock::The build re-solved the component lock (diff above). Build on the pinned ESP-IDF and commit the launcher/dependencies.lock it writes; see docs/tools/Framework-Versions.md."
          exit 1
        fi
