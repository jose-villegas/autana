name: ESP-IDF build
description: >-
  Run a command from launcher/ inside the ESP-IDF container, with the
  container's ccache kept across runs.

# The image already builds through ccache (IDF_CCACHE_ENABLE=1); its cache
# just dies with the container. One key prefix per variant, because a
# restore takes the newest entry under its prefix: shared, each job would get
# whichever variant saved last, with a different sdkconfig.h, and mostly miss.

inputs:
  cache-name:
    description: Names this build's ccache, one per variant.
    required: true
  command:
    description: Shell command run from launcher/.
    required: true

runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/ccache
        key: idf-ccache-${{ inputs.cache-name }}-${{ github.sha }}
        restore-keys: idf-ccache-${{ inputs.cache-name }}-

    # safe.directory: the container's root does not own the checkout, not
    # that autana needs git for this: each command's own `--project ..`
    # names the repository root from launcher/, where this runs.
    #
    # The packs' meshes come from the bake cache (bake/bake.py). They are fetched here, where the workflow's
    # GH_TOKEN can read a run that made them before main publishes them, into a cache the container mounts.
    - name: Fetch the bakes launcher/bakes.lock names
      shell: bash
      run: python3 launcher/tools/bake/bake.py fetch --cache "${{ runner.temp }}/bakes"

    - name: Build in the pinned IDF image
      shell: bash
      env:
        BUILD_COMMAND: ${{ inputs.command }}
      run: |
        image=$(python3 -c 'import sys; sys.path.insert(0, "launcher/tools"); from build.espressif import idf_pin; print(idf_pin()["image"])')
        docker run --rm -t -e IDF_TARGET=esp32s3 \
          -v "$GITHUB_WORKSPACE:/app" -w /app/launcher \
          -v "${{ runner.temp }}/bakes:/bakes" -e AUTANA_BAKE_CACHE=/bakes \
          -v "${{ runner.temp }}/ccache:/ccache" -e CCACHE_DIR=/ccache \
          -e CCACHE_MAXSIZE=150M -e CCACHE_COMPILERCHECK=content \
          -e BUILD_COMMAND "$image" /bin/bash -c \
          'git config --global --add safe.directory "*"; git -C "$IDF_PATH" rev-parse HEAD; ccache -z > /dev/null; eval "$BUILD_COMMAND" && ccache -s'
